<!DOCTYPE html>q
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waheguru Digital Mala</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at center, #351010 0%, #120606 45%, #050202 100%);
    color: white;
    text-align: center;
}

.app {
    max-width: 600px;
    margin: auto;
    padding: 20px 15px 40px;
}

h1 {
    margin: 5px 0;
    font-size: 27px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 10px;
}

/* -------------------------
   DIGITAL MALA
------------------------- */

.mala {
    position: relative;
    width: min(92vw, 440px);
    height: min(92vw, 440px);
    margin: 15px auto;
}

.bead {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #777,
            #292929 60%,
            #111
        );

    transform: translate(-50%, -50%);

    transition:
        background .25s,
        box-shadow .25s,
        transform .25s;
}

.bead.active {
    background:
        radial-gradient(
            circle at 30% 25%,
            #ffaaaa,
            #ff2222 45%,
            #8b0000 100%
        );

    box-shadow:
        0 0 7px #ff2222,
        0 0 16px rgba(255, 0, 0, .75);

    transform:
        translate(-50%, -50%)
        scale(1.15);
}

.bead.guru {
    width: 29px;
    height: 29px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffdddd,
            #ff3030 45%,
            #8b0000
        );

    box-shadow:
        0 0 12px #ff2222,
        0 0 25px rgba(255,0,0,.7);
}

/* -------------------------
   CENTER
------------------------- */

.center {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 180px;
}

.om {
    font-size: 35px;
    margin-bottom: 3px;
}

.progress {
    font-size: 38px;
    font-weight: bold;
}

.progress-label {
    color: #aaa;
    font-size: 14px;
}

.mala-number {
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;

    color: #ff4a4a;
}

/* -------------------------
   VOICE
------------------------- */

.voice {
    margin: 5px auto 15px;
}

.voice-status {
    font-size: 17px;
    color: #ff5555;
    min-height: 25px;
}

.heard {
    color: #999;
    min-height: 24px;
    margin-top: 4px;
}

/* -------------------------
   BUTTONS
------------------------- */

button,
select {
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px 17px;
    margin: 5px;

    background: #1b1b1b;
    color: white;

    font-size: 15px;
}

button {
    cursor: pointer;
}

.start {
    background: #a90000;
    border-color: #ff3333;
}

.start:hover {
    background: #d00000;
}

.pause {
    background: #333;
}

.reset {
    background: #601010;
}

/* -------------------------
   STATS
------------------------- */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

    gap: 10px;

    margin-top: 20px;
}

.stat {
    background: rgba(255,255,255,.06);

    border: 1px solid #333;

    border-radius: 15px;

    padding: 14px;
}

.stat-title {
    color: #999;
    font-size: 13px;
}

.stat-number {
    font-size: 25px;
    font-weight: bold;

    margin-top: 5px;

    color: #ff4545;
}

/* -------------------------
   COMPLETION
------------------------- */

.complete {
    animation: completeAnimation 1s ease-in-out 2;
}

@keyframes completeAnimation {

    50% {
        filter:
            drop-shadow(0 0 25px red);

        transform: scale(1.04);
    }

}

/* -------------------------
   CALENDAR
------------------------- */

.calendar {
    margin-top: 25px;

    padding: 15px;

    background: rgba(255,255,255,.05);

    border: 1px solid #333;

    border-radius: 16px;
}

.calendar h2 {
    margin-top: 0;
}

.month {
    color: #aaa;
}

.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;

    margin-top: 12px;
}

.day {
    min-height: 40px;

    padding: 7px 2px;

    border-radius: 8px;

    font-size: 12px;
}

.day.has-jaap {
    background: #8b0000;

    box-shadow:
        0 0 7px rgba(255,0,0,.35);
}

.small {
    color: #777;

    margin-top: 18px;

    font-size: 12px;
}

</style>
</head>


<body>

<div class="app">

<h1>🙏 Waheguru</h1>

<div class="subtitle">
    Digital 108 Mala
</div>


<!-- MALA -->

<div class="mala" id="mala">

    <div class="center">

        <div class="om">☬</div>

        <div
            class="progress"
            id="progress">
            0 / 108
        </div>

        <div class="progress-label">
            Current Mala
        </div>

        <div
            class="mala-number"
            id="malaNumber">
            Mala 1
        </div>

    </div>

</div>


<!-- VOICE -->

<div class="voice">

    <div
        class="voice-status"
        id="status">
        🎙️ Press Start
    </div>

    <div
        class="heard"
        id="heard">
        Heard: —
    </div>

</div>


<!-- CONTROLS -->

<div>

<button
    class="start"
    onclick="startListening()">
    🎙️ Start
</button>

<button
    class="pause"
    onclick="pauseListening()">
    ⏸ Pause
</button>

<button
    class="reset"
    onclick="resetMala()">
    ↻ Reset
</button>

</div>


<div>

<select id="language">

<option value="en-US">
English
</option>

<option value="pa-IN">
Punjabi
</option>

<option value="hi-IN">
Hindi
</option>

</select>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Completed Malas
</div>

<div
    class="stat-number"
    id="malas">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Total Jaap
</div>

<div
    class="stat-number"
    id="total">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Today
</div>

<div
    class="stat-number"
    id="today">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Current
</div>

<div
    class="stat-number"
    id="current">
0
</div>

</div>

</div>


<!-- CALENDAR -->

<div class="calendar">

<h2>📅 Daily Records</h2>

<div
    class="month"
    id="month">
</div>

<div
    class="calendar-grid"
    id="calendar">
</div>

</div>


<div class="small">
Your records are saved on this device.
</div>

</div>


<script>

/* =================================
   DATA
================================= */

const MAX = 108;

let count =
    Number(
        localStorage.getItem("wg_count") || 0
    );

let total =
    Number(
        localStorage.getItem("wg_total") || 0
    );

let malas =
    Number(
        localStorage.getItem("wg_malas") || 0
    );

let records =
    JSON.parse(
        localStorage.getItem("wg_records") || "{}"
    );

let recognition = null;

let listening = false;


/*
   Version focused on repeated
   continuous Waheguru detection.
*/

let lastProcessedText = "";

let lastProcessedTime = 0;


/* =================================
   CREATE MALA
================================= */

function createMala() {

    const mala =
        document.getElementById("mala");

    /*
       Remove old beads.
    */

    document
        .querySelectorAll(".bead")
        .forEach(b => b.remove());


    const size =
        mala.clientWidth;

    const center =
        size / 2;

    const radius =
        size * .41;


    for (
        let i = 0;
        i < MAX;
        i++
    ) {

        const bead =
            document.createElement("div");

        bead.className =
            "bead";


        if (i === 0) {

            bead.classList.add(
                "guru"
            );

        }


        const angle =
            (i / MAX) *
            Math.PI * 2 -
            Math.PI / 2;


        const x =
            center +
            Math.cos(angle) *
            radius;


        const y =
            center +
            Math.sin(angle) *
            radius;


        bead.style.left =
            x + "px";

        bead.style.top =
            y + "px";


        bead.id =
            "bead-" + i;


        mala.appendChild(
            bead
        );
    }


    updateMala();
}


/* =================================
   UPDATE MALA
================================= */

function updateMala() {

    for (
        let i = 0;
        i < MAX;
        i++
    ) {

        const bead =
            document.getElementById(
                "bead-" + i
            );

        if (!bead) continue;

        bead.classList.toggle(
            "active",
            i < count
        );
    }


    document.getElementById(
        "progress"
    ).textContent =
        count + " / 108";


    document.getElementById(
        "malaNumber"
    ).textContent =
        "Mala " +
        (malas + 1);


    document.getElementById(
        "malas"
    ).textContent =
        malas;


    document.getElementById(
        "total"
    ).textContent =
        total;


    document.getElementById(
        "current"
    ).textContent =
        count;


    updateToday();

    save();

}


/* =================================
   TODAY
================================= */

function todayKey() {

    const d =
        new Date();

    return (
        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2, "0")
    );
}


/* =================================
   ADD COUNT
================================= */

function addCount(amount) {

    if (amount <= 0)
        return;


    const today =
        todayKey();


    if (!records[today]) {

        records[today] = 0;

    }


    /*
       Add each Jaap separately.

       This allows:

       107 + 2

       to complete the mala
       and put 1 into the next mala.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        count++;

        total++;

        records[today]++;


        if (count >= MAX) {

            count = 0;

            malas++;

            malaComplete();

        }

    }


    updateMala();

    drawCalendar();
}


/* =================================
   MALA COMPLETE
================================= */

function malaComplete() {

    const mala =
        document.getElementById(
            "mala"
        );


    mala.classList.add(
        "complete"
    );


    setTimeout(
        () => {
            mala.classList.remove(
                "complete"
            );
        },
        1800
    );


    document.getElementById(
        "status"
    ).textContent =
        "🔴 Mala " +
        malas +
        " Complete";


    /*
       Say it only once.
    */

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                "Mala " +
                malas +
                " complete"
            );


        voice.rate = .85;

        speechSynthesis.speak(
            voice
        );
    }
}


/* =================================
   NORMALIZE WORDS
================================= */

function normalize(text) {

    let s =
        text.toLowerCase();


    /*
       Punjabi.
    */

    s =
        s.replace(
            /ਵਾਹਿਗੁਰੂ|ਵਾਹੇਗੁਰੂ|ਵਾਹੇ ਗੁਰੂ|ਵਾਹਿਗੁਰੁ/g,
            " waheguru "
        );


    /*
       English variations.
    */

    s =
        s.replace(
            /wahe\s+guroo|wahe\s+guro|waheguroo|waheguro|wahe\s+guru/g,
            " waheguru "
        );


    s =
        s.replace(
            /[^a-z\u0A00-\u0A7F\s]/g,
            " "
        );


    s =
        s.replace(
            /\s+/g,
            " "
        )
        .trim();


    return s;
}


/* =================================
   COUNT WORDS
================================= */

function countWaheguru(text) {

    const s =
        normalize(text);


    if (!s)
        return 0;


    /*
       Every occurrence counts.

       Example:

       waheguru
       = 1

       waheguru waheguru
       = 2

       waheguru waheguru waheguru
       = 3
    */

    const matches =
        s.match(/waheguru/g);


    return matches
        ? matches.length
        : 0;
}


/* =================================
   SPEECH RECOGNITION
================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        document.getElementById(
            "status"
        ).textContent =
            "Speech recognition is not supported.";

        return null;
    }


    const r =
        new SpeechRecognition();


    r.continuous = true;

    r.interimResults = false;

    r.maxAlternatives = 3;


    r.lang =
        document.getElementById(
            "language"
        ).value;


    /* -----------------------------
       START
    ----------------------------- */

    r.onstart = function() {

        listening = true;

        document.getElementById(
            "status"
        ).textContent =
            "🔴 Listening…";
    };


    /* -----------------------------
       RESULTS
    ----------------------------- */

    r.onresult =
        function(event) {

        for (
            let i =
                event.resultIndex;

            i <
                event.results.length;

            i++
        ) {

            const result =
                event.results[i];


            if (
                !result.isFinal
            )
                continue;


            const text =
                result[0]
                    .transcript
                    .trim();


            const normalized =
                normalize(text);


            const now =
                Date.now();


            /*
               Only ignore an EXACT
               duplicate result that
               arrives immediately.

               We do NOT ignore another
               "Waheguru" result.
            */

            if (
                normalized ===
                    lastProcessedText
                &&
                now -
                    lastProcessedTime
                    < 1000
            ) {

                continue;

            }


            lastProcessedText =
                normalized;

            lastProcessedTime =
                now;


            const amount =
                countWaheguru(text);


            document.getElementById(
                "heard"
            ).textContent =
                "Heard: " +
                text +
                (
                    amount
                    ? "  (+" +
                      amount +
                      ")"
                    : ""
                );


            if (amount > 0) {

                addCount(amount);

            }

        }

    };


    /* -----------------------------
       ERROR
    ----------------------------- */

    r.onerror =
        function(event) {

        if (
            event.error ===
            "not-allowed"
        ) {

            listening = false;

            document.getElementById(
                "status"
            ).textContent =
                "Microphone permission required.";

            return;
        }


        if (listening) {

            document.getElementById(
                "status"
            ).textContent =
                "🔴 Listening…";
        }

    };


    /* -----------------------------
       AUTO RESTART
    ----------------------------- */

    r.onend =
        function() {

        if (!listening)
            return;


        setTimeout(
            function() {

                try {

                    r.start();

                } catch(e) {}

            },
            250
        );

    };


    return r;
}


/* =================================
   START
================================= */

function startListening() {

    if (!recognition) {

        recognition =
            setupRecognition();

        if (!recognition)
            return;
    }


    recognition.lang =
        document.getElementById(
            "language"
        ).value;


    listening = true;


    try {

        recognition.start();

    } catch(e) {}


    document.getElementById(
        "status"
    ).textContent =
        "🔴 Listening…";
}


/* =================================
   PAUSE
================================= */

function pauseListening() {

    listening = false;


    if (recognition) {

        try {

            recognition.stop();

        } catch(e) {}
    }


    lastProcessedText = "";

    lastProcessedTime = 0;


    document.getElementById(
        "status"
    ).textContent =
        "⏸ Paused";
}


/* =================================
   RESET
================================= */

function resetMala() {

    if (
        !confirm(
            "Reset current mala?"
        )
    )
        return;


    count = 0;

    updateMala();


    document.getElementById(
        "status"
    ).textContent =
        "Current mala reset.";
}


/* =================================
   SAVE
================================= */

function save() {

    localStorage.setItem(
        "wg_count",
        count
    );

    localStorage.setItem(
        "wg_total",
        total
    );

    localStorage.setItem(
        "wg_malas",
        malas
    );

    localStorage.setItem(
        "wg_records",
        JSON.stringify(records)
    );
}


/* =================================
   TODAY
================================= */

function updateToday() {

    const key =
        todayKey();


    document.getElementById(
        "today"
    ).textContent =
        records[key] || 0;
}


/* =================================
   CALENDAR
================================= */

function drawCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    document.getElementById(
        "month"
    ).textContent =
        now.toLocaleString(
            "default",
            {
                month: "long",
                year: "numeric"
            }
        );


    const names =
        ["S","M","T","W","T","F","S"];


    names.forEach(
        name => {

            const d =
                document.createElement(
                    "div"
                );

            d.className =
                "day";

            d.textContent =
                name;

            calendar.appendChild(d);

        }
    );


    const first =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < first;
        i++
    ) {

        const blank =
            document.createElement(
                "div"
            );

        blank.className =
            "day";

        calendar.appendChild(
            blank
        );
    }


    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const d =
            document.createElement(
                "div"
            );


        d.className =
            "day";


        const key =
            year +
            "-" +
            String(
                month + 1
            ).padStart(2,"0") +
            "-" +
            String(day)
                .padStart(2,"0");


        const value =
            records[key] || 0;


        d.innerHTML =
            "<strong>" +
            day +
            "</strong>" +
            (
                value
                ? "<br>" + value
                : ""
            );


        if (value) {

            d.classList.add(
                "has-jaap"
            );

        }


        calendar.appendChild(d);

    }

}


/* =================================
   LANGUAGE
================================= */

document
    .getElementById("language")
    .addEventListener(
        "change",
        function() {

            if (recognition) {

                recognition.lang =
                    this.value;

            }

        }
    );


/* =================================
   STARTUP
================================= */

window.addEventListener(
    "load",
    function() {

        createMala();

        updateMala();

        drawCalendar();

    }
);


window.addEventListener(
    "resize",
    createMala
);

</script>

</body>
</html>
