<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waheguru Voice Counter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #222;
}

body.dark {
    background: #121212;
    color: #eee;
}

.app {
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

h1 {
    text-align: center;
    margin: 8px 0 4px;
    font-size: 30px;
}

.sub {
    text-align: center;
    color: #777;
    margin-bottom: 18px;
}

.dark .sub {
    color: #aaa;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 18px;
    margin: 12px 0;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.dark .card {
    background: #1e1e1e;
}

.counter {
    font-size: 86px;
    font-weight: 800;
    text-align: center;
    margin: 10px 0;
}

.target {
    text-align: center;
    color: #777;
    margin-bottom: 12px;
}

.progress {
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #555;
    transition: 0.25s;
}

button,
select {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 14px;
    font-size: 17px;
    background: #222;
    color: white;
}

button.secondary {
    background: #777;
}

button.danger {
    background: #b33;
}

.dark button,
.dark select {
    background: #eee;
    color: #111;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.controls button {
    margin-top: 10px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    text-align: center;
}

.stat {
    padding: 12px;
    border-radius: 16px;
    background: #eee;
}

.dark .stat {
    background: #292929;
}

.stat b {
    display: block;
    font-size: 28px;
}

.heard {
    text-align: center;
    min-height: 25px;
    margin-top: 12px;
    color: #777;
}

.calendar-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.calendar-head button {
    width: auto;
    padding: 8px 14px;
    margin: 0;
}

#monthTitle {
    font-size: 20px;
    font-weight: 700;
}

.week,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 8px;
}

.week div {
    text-align: center;
    font-size: 12px;
    color: #888;
}

.day {
    min-height: 48px;
    border-radius: 10px;
    background: #eee;
    padding: 5px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
}

.dark .day {
    background: #292929;
}

.day.has-count {
    font-weight: 700;
}

.day.today {
    outline: 2px solid #555;
}

.day small {
    display: block;
    color: #777;
    font-size: 10px;
    margin-top: 3px;
}

.record-title {
    text-align: center;
    margin: 4px 0 12px;
}

.record {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.dark .record {
    border-bottom: 1px solid #444;
}

.empty {
    text-align: center;
    color: #888;
    padding: 10px;
}

.note {
    font-size: 13px;
    color: #777;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="app">

<h1>🙏 Waheguru Counter</h1>

<div class="sub">
Voice • Automatic Counting • Daily Records
</div>


<!-- COUNTER -->
<div class="card">

<div class="counter" id="count">0</div>

<div class="target">
Mala progress:
<span id="mala">0</span> / 108
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="heard" id="heard">
Press Start Listening
</div>


<select id="language">
<option value="en-US">English recognition</option>
<option value="pa-IN">Punjabi recognition</option>
</select>


<div class="controls">

<button id="start">
🎙️ Start
</button>

<button id="pause" class="secondary">
⏸ Pause
</button>

</div>


<button id="reset" class="danger">
Reset Current Count
</button>


<button id="dark" class="secondary">
🌙 Dark Mode
</button>

</div>



<!-- TODAY / TOTAL -->
<div class="card stats">

<div class="stat">
<span>Today</span>
<b id="today">0</b>
</div>

<div class="stat">
<span>Total</span>
<b id="total">0</b>
</div>

</div>



<!-- CALENDAR -->
<div class="card">

<div class="calendar-head">

<button onclick="changeMonth(-1)">
‹
</button>

<div id="monthTitle"></div>

<button onclick="changeMonth(1)">
›
</button>

</div>


<div class="week">

<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>

</div>


<div class="days" id="days"></div>

</div>



<!-- RECORDS -->
<div class="card">

<h3 class="record-title" id="recordTitle">
Recent Daily Records
</h3>

<div id="records"></div>

<p class="note">
🙏 Your daily counts are saved on this device.
Tap any calendar date to see its record.
</p>

</div>

</div>


<script>

/* =========================================
   SAVED DATA
========================================= */

let count =
    Number(localStorage.getItem("wg_count") || 0);

let total =
    Number(localStorage.getItem("wg_total") || 0);

let records =
    JSON.parse(
        localStorage.getItem("wg_records") || "{}"
    );


/* =========================================
   SPEECH VARIABLES
========================================= */

let listening = false;

let recognition = null;

/*
IMPORTANT:
This prevents the same speech recognition
result from being counted more than once.
*/
let processedResults = new Set();

/*
Longer cooldown prevents one spoken word
from being counted twice.
*/
let lastCountTime = 0;

const COOLDOWN = 1500;


/* Calendar month */
let viewDate = new Date();



/* =========================================
   ELEMENT SHORTCUT
========================================= */

const $ = id => document.getElementById(id);



/* =========================================
   DATE KEY
========================================= */

function dateKey(date = new Date()) {

    return (
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0")
    );

}



/* =========================================
   SAVE EVERYTHING
========================================= */

function save() {

    localStorage.setItem(
        "wg_count",
        count
    );

    localStorage.setItem(
        "wg_total",
        total
    );

    localStorage.setItem(
        "wg_records",
        JSON.stringify(records)
    );

}



/* =========================================
   UPDATE SCREEN
========================================= */

function update() {

    const todayKey = dateKey();

    const todayCount =
        records[todayKey] || 0;


    $("count").textContent = count;

    $("today").textContent =
        todayCount;

    $("total").textContent =
        total;


    /*
    Show progress toward 108
    */
    const malaCount =
        count % 108;

    $("mala").textContent =
        malaCount;


    const progress =
        (malaCount / 108) * 100;

    $("bar").style.width =
        progress + "%";


    renderCalendar();

    renderRecords();

}



/* =========================================
   RECOGNIZE WAHEGURU
========================================= */

function isWaheguru(text) {

    const s =
        text
        .toLowerCase()
        .replace(
            /[^a-z\u0a00-\u0a7f ]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    return (

        s.includes("waheguru") ||

        s.includes("wahe guru") ||

        s.includes("waheguroo") ||

        s.includes("wahe guro") ||

        s.includes("ਵਾਹਿਗੁਰੂ") ||

        s.includes("ਵਾਹੇਗੁਰੂ") ||

        s.includes("ਵਾਹੇ ਗੁਰੂ")

    );

}



/* =========================================
   ADD ONE COUNT
========================================= */

function addCount() {

    const now = Date.now();


    /*
    VERY IMPORTANT:

    Don't count again if the browser
    sends another result immediately.
    */

    if (
        now - lastCountTime <
        COOLDOWN
    ) {

        return;

    }


    lastCountTime = now;


    /* Increase current count */
    count++;


    /* Increase lifetime total */
    total++;


    /* Save today's record */
    const key =
        dateKey();


    if (!records[key]) {

        records[key] = 0;

    }


    records[key]++;


    save();

    update();


    $("heard").textContent =
        "✓ Waheguru counted once";


    /*
    Small confirmation sound
    */

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.04;


        oscillator.connect(gain);

        gain.connect(ctx.destination);


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + 0.08
        );

    }

    catch (e) {}

}



/* =========================================
   SPEECH RECOGNITION
========================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        $("heard").textContent =
            "Speech recognition is not supported in this browser.";

        return null;

    }


    const r =
        new SpeechRecognition();


    r.continuous = true;

    r.interimResults = true;

    r.lang =
        $("language").value;


    /*
    Keeps track of final results
    */

    r.onresult = function(event) {


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {


            const result =
                event.results[i];


            const text =
                result[0].transcript;


            $("heard").textContent =
                "Heard: " + text;


            /*
            KEY FIX:

            Only process FINAL speech.

            Interim speech is ignored.

            This stops the browser from counting
            the same word once during interim
            recognition and again when finalized.
            */

            if (!result.isFinal) {

                continue;

            }


            /*
            Create a unique ID for this result.

            Prevents the exact same result from
            being processed twice.
            */

            const resultID =
                event.timeStamp +
                "-" +
                i +
                "-" +
                text;


            if (
                processedResults.has(
                    resultID
                )
            ) {

                continue;

            }


            processedResults.add(
                resultID
            );


            /*
            Keep memory small.
            */

            if (
                processedResults.size >
                100
            ) {

                const first =
                    processedResults.values()
                    .next()
                    .value;

                processedResults.delete(
                    first
                );

            }


            /*
            Now check Waheguru.
            */

            if (
                isWaheguru(text)
            ) {

                addCount();

            }

        }

    };


    r.onerror = function(event) {

        $("heard").textContent =
            "Recognition: " +
            event.error;

    };


    /*
    Automatically restart if recognition
    stops while Start mode is active.
    */

    r.onend = function() {

        if (listening) {

            setTimeout(
                function() {

                    try {

                        recognition =
                            setupRecognition();

                        recognition.start();

                    }

                    catch (e) {}

                },
                300
            );

        }

    };


    return r;

}



/* =========================================
   START
========================================= */

$("start").onclick =
function() {

    if (!recognition) {

        recognition =
            setupRecognition();

    }


    if (!recognition) {

        return;

    }


    listening = true;


    try {

        recognition.start();

        $("heard").textContent =
            "🎙️ Listening... Say Waheguru";

    }

    catch (e) {}

};



/* =========================================
   PAUSE
========================================= */

$("pause").onclick =
function() {

    listening = false;


    if (recognition) {

        try {

            recognition.stop();

        }

        catch (e) {}

    }


    $("heard").textContent =
        "⏸ Paused";

};



/* =========================================
   RESET CURRENT COUNT
========================================= */

$("reset").onclick =
function() {

    count = 0;

    save();

    update();

    $("heard").textContent =
        "Current count reset";

};



/* =========================================
   CHANGE LANGUAGE
========================================= */

$("language").onchange =
function() {

    listening = false;


    if (recognition) {

        try {

            recognition.stop();

        }

        catch (e) {}

    }


    recognition = null;


    $("heard").textContent =
        "Language changed. Press Start.";

};



/* =========================================
   DARK MODE
========================================= */

$("dark").onclick =
function() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "wg_dark",
        document.body.classList.contains(
            "dark"
        )
    );

};



if (
    localStorage.getItem(
        "wg_dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}



/* =========================================
   CALENDAR
========================================= */

function renderCalendar() {

    const year =
        viewDate.getFullYear();


    const month =
        viewDate.getMonth();


    $("monthTitle").textContent =
        viewDate.toLocaleString(
            "en",
            {
                month: "long",
                year: "numeric"
            }
        );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const box =
        $("days");


    box.innerHTML = "";


    /*
    Empty spaces before first day
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        box.appendChild(empty);

    }



    /*
    Create calendar days
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "day";


        const thisDate =
            new Date(
                year,
                month,
                day
            );


        const key =
            dateKey(thisDate);


        const dailyCount =
            records[key] || 0;


        /*
        Show count on day
        */

        if (dailyCount > 0) {

            element.classList.add(
                "has-count"
            );

        }


        /*
        Highlight today
        */

        if (
            key === dateKey()
        ) {

            element.classList.add(
                "today"
            );

        }


        element.innerHTML =
            day +
            (
                dailyCount
                ? "<small>" +
                  dailyCount +
                  "</small>"
                : ""
            );


        /*
        Click date to see record
        */

        element.onclick =
        function() {

            showRecord(key);

        };


        box.appendChild(
            element
        );

    }

}



/* =========================================
   CHANGE MONTH
========================================= */

function changeMonth(amount) {

    viewDate.setMonth(
        viewDate.getMonth() +
        amount
    );


    renderCalendar();

}



/* =========================================
   SHOW SELECTED DAY
========================================= */

function showRecord(key) {

    const dailyCount =
        records[key] || 0;


    $("recordTitle").textContent =
        "Record: " + key;


    if (dailyCount > 0) {

        $("records").innerHTML =
            `
            <div class="empty">
                🙏 ${dailyCount}
                Waheguru counted
            </div>
            `;

    }

    else {

        $("records").innerHTML =
            `
            <div class="empty">
                No count recorded for this day.
            </div>
            `;

    }

}



/* =========================================
   RECENT RECORDS
========================================= */

function renderRecords() {

    /*
    Don't overwrite selected date
    */

    if (
        $("recordTitle")
        .textContent
        .startsWith("Record:")
    ) {

        return;

    }


    $("recordTitle").textContent =
        "Recent Daily Records";


    const keys =
        Object.keys(records)
        .sort()
        .reverse()
        .slice(0, 10);


    if (keys.length === 0) {

        $("records").innerHTML =
            `
            <div class="empty">
                No daily records yet.
            </div>
            `;

        return;

    }


    $("records").innerHTML =
        keys
        .map(
            key =>
            `
            <div class="record">
                <span>📅 ${key}</span>
                <b>🙏 ${records[key]}</b>
            </div>
            `
        )
        .join("");

}



/* =========================================
   START APP
========================================= */

update();

</script>

</body>
</html>
