<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Waheguru Voice Counter</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 17px;
      color: #666;
      margin-bottom: 35px;
      text-align: center;
    }

    .counter {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 72px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      margin-bottom: 30px;
    }

    .status {
      min-height: 28px;
      font-size: 16px;
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    #startBtn {
      background: #222;
      color: white;
    }

    #stopBtn {
      background: #ddd;
      color: #222;
    }

    #resetBtn {
      background: #eee;
      color: #555;
    }

    button:active {
      transform: scale(0.98);
    }

    .heard {
      margin-top: 25px;
      padding: 12px 18px;
      background: white;
      border-radius: 12px;
      width: 100%;
      text-align: center;
      color: #777;
      min-height: 48px;
    }

    .listening {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      }
      50% {
        box-shadow: 0 8px 35px rgba(0,0,0,0.25);
      }
      100% {
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      }
    }

    .permission {
      font-size: 14px;
      color: #888;
      text-align: center;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🙏 Waheguru Counter</h1>

    <div class="subtitle">
      Speak “Waheguru” to count
    </div>

    <div id="counter" class="counter">
      0
    </div>

    <div id="status" class="status">
      Press Start and allow microphone access.
    </div>

    <div class="buttons">
      <button id="startBtn">
        ▶️ Start Listening
      </button>

      <button id="stopBtn">
        ⏹ Stop
      </button>

      <button id="resetBtn">
        🔄 Reset Count
      </button>
    </div>

    <div id="heard" class="heard">
      Heard: —
    </div>

    <div class="permission">
      Keep this page open while chanting.
      Your count is saved automatically on this device.
    </div>

  </div>

<script>

  // ==============================
  // WAHEGURU VOICE COUNTER
  // Version 1
  // ==============================

  let count = Number(localStorage.getItem("waheguruCount")) || 0;

  let recognition = null;
  let listening = false;

  // Prevent duplicate counting
  let lastCountTime = 0;

  // How many milliseconds before another
  // Waheguru can be counted
  const COOLDOWN = 700;


  // ------------------------------
  // DISPLAY COUNT
  // ------------------------------

  function updateCounter() {
    document.getElementById("counter").textContent = count;

    localStorage.setItem("waheguruCount", count);
  }

  updateCounter();


  // ------------------------------
  // CHECK BROWSER SUPPORT
  // ------------------------------

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    document.getElementById("status").textContent =
      "Voice recognition is not supported in this browser.";

    document.getElementById("startBtn").disabled = true;

  } else {

    recognition = new SpeechRecognition();

    // Keep listening continuously
    recognition.continuous = true;

    // We want results as soon as possible
    recognition.interimResults = true;

    // English recognition
    recognition.lang = "en-US";

    // Return alternative interpretations
    recognition.maxAlternatives = 5;


    // ------------------------------
    // SPEECH RESULT
    // ------------------------------

    recognition.onresult = function(event) {

      let transcript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript + " ";
      }

      transcript = transcript.trim();

      document.getElementById("heard").textContent =
        "Heard: " + transcript;


      // Check if speech contains Waheguru
      if (containsWaheguru(transcript)) {

        const now = Date.now();

        // Prevent duplicate counting
        if (now - lastCountTime > COOLDOWN) {

          count++;

          lastCountTime = now;

          updateCounter();

          document.getElementById("status").textContent =
            "🙏 Waheguru counted!";

        }
      }
    };


    // ------------------------------
    // RECOGNITION STARTED
    // ------------------------------

    recognition.onstart = function() {

      listening = true;

      document.getElementById("status").textContent =
        "🎙️ Listening... Speak Waheguru";

      document
        .getElementById("counter")
        .classList.add("listening");
    };


    // ------------------------------
    // RECOGNITION ENDED
    // ------------------------------

    recognition.onend = function() {

      document
        .getElementById("counter")
        .classList.remove("listening");

      // Automatically restart if user
      // hasn't pressed Stop

      if (listening) {

        try {
          recognition.start();
        } catch (error) {
          console.log(error);
        }

      } else {

        document.getElementById("status").textContent =
          "Stopped.";
      }
    };


    // ------------------------------
    // ERROR HANDLING
    // ------------------------------

    recognition.onerror = function(event) {

      console.log("Speech recognition error:", event.error);

      if (event.error === "not-allowed") {

        listening = false;

        document.getElementById("status").textContent =
          "Microphone permission was denied.";

      } else if (event.error === "no-speech") {

        document.getElementById("status").textContent =
          "Listening...";

      } else {

        document.getElementById("status").textContent =
          "Voice recognition error: " + event.error;
      }
    };

  }


  // ------------------------------
  // DETECT WAHEGURU
  // ------------------------------

  function containsWaheguru(text) {

    text = text.toLowerCase();

    // Remove punctuation
    text = text.replace(/[.,!?;:'"]/g, "");

    // Common speech-recognition variations
    const variations = [

      "waheguru",
      "wahe guru",
      "wahegooru",
      "wahe goru",
      "waheguroo",
      "wahe guro",
      "wahe guru ji",
      "waheguru ji",
      "wahe guru ji"
    ];


    for (let word of variations) {

      if (text.includes(word)) {
        return true;
      }

    }

    return false;
  }


  // ------------------------------
  // START BUTTON
  // ------------------------------

  document
    .getElementById("startBtn")
    .addEventListener("click", function() {

      if (!recognition) {
        return;
      }

      listening = true;

      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }

    });


  // ------------------------------
  // STOP BUTTON
  // ------------------------------

  document
    .getElementById("stopBtn")
    .addEventListener("click", function() {

      listening = false;

      if (recognition) {

        try {
          recognition.stop();
        } catch (error) {
          console.log(error);
        }

      }

      document.getElementById("status").textContent =
        "Stopped listening.";

    });


  // ------------------------------
  // RESET BUTTON
  // ------------------------------

  document
    .getElementById("resetBtn")
    .addEventListener("click", function() {

      const confirmation =
        confirm("Reset the Waheguru count to 0?");

      if (confirmation) {

        count = 0;

        updateCounter();

        document.getElementById("status").textContent =
          "Count reset to 0.";

        document.getElementById("heard").textContent =
          "Heard: —";
      }

    });

</script>

</body>
</html>
