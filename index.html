<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>Waheguru Voice Counter</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;

  background: #f4f4f4;
  color: #222;

  transition: 0.3s;
}

body.dark {
  background: #111;
  color: white;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;

  margin: auto;

  padding: 30px 20px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;
}

h1 {
  font-size: 32px;
  margin: 0;
  text-align: center;
}

.subtitle {
  margin-top: 8px;
  margin-bottom: 30px;

  color: #777;

  text-align: center;
}

.dark .subtitle {
  color: #aaa;
}


/* COUNTER */

.counter {

  width: 270px;
  height: 270px;

  border-radius: 50%;

  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 70px;
  font-weight: 700;

  box-shadow:
    0 10px 35px rgba(0,0,0,0.15);

  margin-bottom: 25px;

  transition: 0.2s;
}

.dark .counter {
  background: #222;
}


/* LISTENING ANIMATION */

.counter.listening {

  animation: pulse 1.5s infinite;
}

@keyframes pulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.04);
  }

  100% {
    transform: scale(1);
  }

}


/* STATUS */

.status {

  min-height: 25px;

  text-align: center;

  margin-bottom: 18px;

  font-size: 16px;
}


/* BUTTONS */

.buttons {

  width: 100%;

  display: flex;
  flex-direction: column;

  gap: 10px;
}

button {

  width: 100%;

  min-height: 55px;

  border: none;

  border-radius: 15px;

  font-size: 19px;

  font-weight: 600;

  cursor: pointer;
}

.start {

  background: #222;
  color: white;
}

.pause {

  background: #ddd;
  color: #222;
}

.reset {

  background: #eee;
  color: #555;
}

.dark .pause {

  background: #444;
  color: white;
}

.dark .reset {

  background: #333;
  color: white;
}


/* STATS */

.stats {

  width: 100%;

  display: flex;

  gap: 10px;

  margin-top: 20px;
}

.stat {

  flex: 1;

  background: white;

  border-radius: 14px;

  padding: 15px;

  text-align: center;
}

.dark .stat {

  background: #222;
}

.stat-number {

  font-size: 25px;

  font-weight: 700;
}

.stat-label {

  font-size: 13px;

  color: #777;

  margin-top: 4px;
}

.dark .stat-label {

  color: #aaa;
}


/* HEARD TEXT */

.heard {

  width: 100%;

  background: white;

  border-radius: 12px;

  padding: 12px;

  margin-top: 15px;

  text-align: center;

  color: #777;

  min-height: 45px;
}

.dark .heard {

  background: #222;
  color: #aaa;
}


/* DARK MODE */

.dark-button {

  margin-top: 15px;

  background: transparent;

  border: 1px solid #aaa;

  color: inherit;

  min-height: 45px;

  font-size: 16px;
}


/* FOOTER */

.info {

  margin-top: 15px;

  text-align: center;

  font-size: 13px;

  color: #888;

  line-height: 1.5;
}

</style>
</head>


<body>

<div class="app">

  <h1>🙏 Waheguru Counter</h1>

  <div class="subtitle">
    Speak Waheguru to count
  </div>


  <!-- COUNTER -->

  <div id="counter" class="counter">
    0
  </div>


  <!-- STATUS -->

  <div id="status" class="status">
    Press Start Listening
  </div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      class="start">

      ▶️ Start Listening

    </button>


    <button
      id="pauseBtn"
      class="pause">

      ⏸ Pause

    </button>


    <button
      id="resetBtn"
      class="reset">

      🔄 Reset

    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div
        id="todayCount"
        class="stat-number">

        0

      </div>

      <div class="stat-label">
        Today
      </div>

    </div>


    <div class="stat">

      <div
        id="totalCount"
        class="stat-number">

        0

      </div>

      <div class="stat-label">
        Total
      </div>

    </div>

  </div>


  <!-- WHAT PHONE HEARD -->

  <div
    id="heard"
    class="heard">

    Heard: —

  </div>


  <!-- DARK MODE -->

  <button
    id="darkBtn"
    class="dark-button">

    🌙 Dark Mode

  </button>


  <div class="info">

    Keep Safari open while chanting.
    <br>
    Your count is saved automatically.

  </div>

</div>


<script>


/* =====================================
   WAHEGURU COUNTER VERSION 2
   ===================================== */


/* -------------------------------------
   STORAGE
------------------------------------- */

let totalCount =
  Number(localStorage.getItem("waheguruTotal")) || 0;


let savedDate =
  localStorage.getItem("waheguruDate");


let todayCount =
  Number(localStorage.getItem("waheguruToday")) || 0;


const today =
  new Date().toISOString().split("T")[0];


/* New day */

if (savedDate !== today) {

  todayCount = 0;

  localStorage.setItem(
    "waheguruDate",
    today
  );

  localStorage.setItem(
    "waheguruToday",
    "0"
  );
}


/* -------------------------------------
   VARIABLES
------------------------------------- */

let recognition = null;

let listening = false;

let lastCountTime = 0;


/*
 Prevent the same word from being
 counted repeatedly.
*/

const COOLDOWN = 1000;


/* -------------------------------------
   DISPLAY
------------------------------------- */

function updateDisplay() {

  document.getElementById(
    "counter"
  ).textContent = totalCount;


  document.getElementById(
    "totalCount"
  ).textContent = totalCount;


  document.getElementById(
    "todayCount"
  ).textContent = todayCount;


  localStorage.setItem(
    "waheguruTotal",
    totalCount
  );


  localStorage.setItem(
    "waheguruToday",
    todayCount
  );

}


updateDisplay();


/* -------------------------------------
   SPEECH RECOGNITION
------------------------------------- */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById(
    "status"
  ).textContent =
    "Voice recognition is not supported.";

  document.getElementById(
    "startBtn"
  ).disabled = true;

}


else {

  recognition =
    new SpeechRecognition();


  recognition.continuous = true;


  recognition.interimResults = true;


  /*
   English is used because Safari's
   speech recognition works well with
   English words.
  */

  recognition.lang = "en-US";


  recognition.maxAlternatives = 5;


  /* ----------------------------------
     RESULT
  ---------------------------------- */

  recognition.onresult =
  function(event) {

    let text = "";


    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      text +=
        event.results[i][0].transcript
        + " ";

    }


    text = text.trim();


    document.getElementById(
      "heard"
    ).textContent =
      "Heard: " + text;


    /*
     Check for Waheguru.
    */

    if (containsWaheguru(text)) {

      const now = Date.now();


      if (
        now - lastCountTime
        > COOLDOWN
      ) {

        addCount();

        lastCountTime = now;

      }

    }

  };


  /* ----------------------------------
     START
  ---------------------------------- */

  recognition.onstart =
  function() {

    listening = true;


    document.getElementById(
      "status"
    ).textContent =
      "🎙️ Listening... Speak Waheguru";


    document.getElementById(
      "counter"
    ).classList.add(
      "listening"
    );

  };


  /* ----------------------------------
     END
  ---------------------------------- */

  recognition.onend =
  function() {

    document.getElementById(
      "counter"
    ).classList.remove(
      "listening"
    );


    /*
     Safari sometimes stops speech
     recognition automatically.

     Restart if user has not paused.
    */

    if (listening) {

      setTimeout(
        function() {

          try {

            recognition.start();

          }

          catch(error) {

            console.log(error);

          }

        },
        300
      );

    }

  };


  /* ----------------------------------
     ERROR
  ---------------------------------- */

  recognition.onerror =
  function(event) {

    console.log(
      "Speech error:",
      event.error
    );


    if (
      event.error ===
      "not-allowed"
    ) {

      listening = false;


      document.getElementById(
        "status"
      ).textContent =
        "Please allow microphone access.";

    }


    else if (
      event.error ===
      "no-speech"
    ) {

      if (listening) {

        document.getElementById(
          "status"
        ).textContent =
          "🎙️ Listening...";

      }

    }

  };

}


/* -------------------------------------
   DETECT WAHEGURU
------------------------------------- */

function containsWaheguru(text) {

  text =
    text.toLowerCase();


  /*
   Remove punctuation.
  */

  text =
    text.replace(
      /[.,!?;:'"]/g,
      ""
    );


  /*
   Common recognition variations.
  */

  const words = [

    "waheguru",

    "wahe guru",

    "wahegooru",

    "wahe goru",

    "waheguroo",

    "wahe guro",

    "waheguru ji",

    "wahe guru ji",

    "waheguro ji",

    "wahegooru ji"

  ];


  for (
    let word of words
  ) {

    if (
      text.includes(word)
    ) {

      return true;

    }

  }


  return false;

}


/* -------------------------------------
   ADD COUNT
------------------------------------- */

function addCount() {

  totalCount++;

  todayCount++;


  updateDisplay();


  document.getElementById(
    "status"
  ).textContent =
    "🙏 Waheguru counted";


  /*
   Confirmation sound.
  */

  playSound();

}


/* -------------------------------------
   SOUND
------------------------------------- */

function playSound() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      880;


    oscillator.connect(gain);


    gain.connect(
      audioContext.destination
    );


    gain.gain.value =
      0.08;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime
      + 0.08
    );

  }

  catch(error) {

    console.log(error);

  }

}


/* -------------------------------------
   START BUTTON
------------------------------------- */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    function() {

      if (!recognition) {
        return;
      }


      listening = true;


      try {

        recognition.start();

      }

      catch(error) {

        console.log(error);

      }

    }
  );


/* -------------------------------------
   PAUSE BUTTON
------------------------------------- */

document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    function() {

      listening = false;


      if (recognition) {

        try {

          recognition.stop();

        }

        catch(error) {

          console.log(error);

        }

      }


      document.getElementById(
        "status"
      ).textContent =
        "⏸ Paused";


      document.getElementById(
        "counter"
      ).classList.remove(
        "listening"
      );

    }
  );


/* -------------------------------------
   RESET BUTTON
------------------------------------- */

document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    function() {

      if (
        confirm(
          "Reset today's and total count?"
        )
      ) {

        totalCount = 0;

        todayCount = 0;


        updateDisplay();


        document.getElementById(
          "status"
        ).textContent =
          "Count reset to 0.";

      }

    }
  );


/* -------------------------------------
   DARK MODE
------------------------------------- */

const darkSaved =
  localStorage.getItem(
    "waheguruDark"
  );


if (darkSaved === "true") {

  document.body.classList.add(
    "dark"
  );

  document.getElementById(
    "darkBtn"
  ).textContent =
    "☀️ Light Mode";

}


document
  .getElementById("darkBtn")
  .addEventListener(
    "click",
    function() {

      document.body.classList.toggle(
        "dark"
      );


      const dark =
        document.body.classList.contains(
          "dark"
        );


      localStorage.setItem(
        "waheguruDark",
        dark
      );


      this.textContent =
        dark
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";

    }
  );

</script>

</body>
</html>
