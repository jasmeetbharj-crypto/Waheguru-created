<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waheguru Simran - Digital 108-Bead Mala</title>
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --border-color: #262626;
      --primary-amber: #ff9900;
      --primary-glow: rgba(255, 153, 0, 0.4);
      --text-main: #f5f5f5;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Header Section */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .header-text {
      flex: 1;
      text-align: center;
      padding: 0 8px;
    }

    .header-text h1 {
      font-size: clamp(1.4rem, 6vw, 1.8rem);
      color: var(--primary-amber);
      text-shadow: 0 0 12px var(--primary-glow);
      font-weight: 700;
      white-space: nowrap;
    }

    .header-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: #1f1f1f;
    }

    /* Status Pill */
    .status-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }

    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Counter Visualization */
    .counter-display {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .svg-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .center-circle {
      width: 170px;
      height: 170px;
      background: #000;
      border-radius: 50%;
      border: 2px solid var(--primary-amber);
      box-shadow: inset 0 0 20px var(--primary-glow), 0 0 20px var(--primary-glow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .count-number {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary-amber);
      line-height: 1;
    }

    .mala-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Auto Mic Off Bar */
    .info-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .info-card strong {
      color: var(--primary-amber);
    }

    /* Controls */
    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.2fr;
      gap: 10px;
    }

    .btn {
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary-amber);
      color: #000;
      border: none;
    }

    .btn-primary:hover {
      background: #e68a00;
    }

    /* Calendar Card Consolidated */
    .calendar-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
    }

    .btn-full {
      width: 100%;
      justify-content: center;
    }

    /* Settings Drawer Panel */
    .settings-panel {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 0.8rem;
    }

    .settings-panel.active {
      display: flex;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="range"] {
      accent-color: var(--primary-amber);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header">
      <button class="icon-btn" title="Toggle Mode">☀️</button>
      <div class="header-text">
        <h1>Waheguru Simran</h1>
        <p>Digital 108-Bead Mala—V41</p>
      </div>
      <button class="icon-btn" id="settingsToggle" title="Settings">⚙️</button>
    </div>

    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Mic ready — tap Start</span>
    </div>

    <div class="counter-display">
      <svg class="svg-ring" viewBox="0 0 300 300">
        <circle id="beadTrack" cx="150" cy="150" r="130" fill="none" stroke="#222" stroke-width="8" />
        <circle id="beadProgress" cx="150" cy="150" r="130" fill="none" stroke="var(--primary-amber)" stroke-width="12"
          stroke-dasharray="816.8" stroke-dashoffset="816.8" stroke-linecap="round" />
      </svg>
      <div class="center-circle">
        <div class="count-number" id="beadCount">0</div>
        <div class="mala-label" id="malaCount">Mala #1</div>
      </div>
    </div>

    <div class="info-card">
      Auto mic-off after: <strong><span id="timerVal">45</span> seconds</strong><br />
      <span style="font-size: 0.7rem; opacity: 0.7;">Timer starts when listening begins.</span>
    </div>

    <div class="controls-grid">
      <button class="btn btn-primary" id="startBtn">🎙️ Start</button>
      <button class="btn" id="pauseBtn">⏸️ Pause</button>
      <button class="btn" id="resetBtn">🔄 Reset Mala</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <label for="sensitivity">Mic Sensitivity Threshold:</label>
        <input type="range" id="sensitivity" min="1" max="10" value="5">
      </div>
      <div class="setting-row">
        <label for="hapticsToggle">Haptic Feedback:</label>
        <input type="checkbox" id="hapticsToggle" checked>
      </div>
    </div>

    <div class="calendar-card">
      <button class="btn btn-full" id="calendarBtn">
        📅 View History & Calendar
      </button>
    </div>

  </div>

  <script>
    // State Variables
    let currentBead = parseInt(localStorage.getItem('v41_bead')) || 0;
    let currentMala = parseInt(localStorage.getItem('v41_mala')) || 1;
    let isListening = false;
    const maxBeads = 108;
    const circumference = 2 * Math.PI * 130;

    // DOM Elements
    const beadCountEl = document.getElementById('beadCount');
    const malaCountEl = document.getElementById('malaCount');
    const beadProgress = document.getElementById('beadProgress');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const hapticsToggle = document.getElementById('hapticsToggle');

    // Web Audio Synthesis for Chime
    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.log('Audio Context restricted');
      }
    }

    // Update UI Elements
    function updateDisplay() {
      beadCountEl.textContent = currentBead;
      malaCountEl.textContent = `Mala #${currentMala}`;
      
      const offset = circumference - (currentBead / maxBeads) * circumference;
      beadProgress.style.strokeDasharray = `${circumference}`;
      beadProgress.style.strokeDashoffset = offset;

      localStorage.setItem('v41_bead', currentBead);
      localStorage.setItem('v41_mala', currentMala);
    }

    // Increment logic
    function incrementCounter() {
      currentBead++;
      if (hapticsToggle.checked && navigator.vibrate) {
        navigator.vibrate(40);
      }
      
      if (currentBead >= maxBeads) {
        playChime();
        currentBead = 0;
        currentMala++;
      }
      updateDisplay();
    }

    // Controls Event Listeners
    startBtn.addEventListener('click', () => {
      isListening = true;
      statusDot.classList.add('active');
      statusText.textContent = 'Listening for "Waheguru"...';
    });

    pauseBtn.addEventListener('click', () => {
      isListening = false;
      statusDot.classList.remove('active');
      statusText.textContent = 'Mic paused';
    });

    resetBtn.addEventListener('click', () => {
      if (confirm("Reset current Mala count?")) {
        currentBead = 0;
        updateDisplay();
      }
    });

    // Manual increment on circle tap
    document.querySelector('.center-circle').addEventListener('click', () => {
      incrementCounter();
    });

    // Settings Toggle
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    // Init
    updateDisplay();
  </script>
</body>
</html>
