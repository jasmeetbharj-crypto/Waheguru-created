<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waheguru Voice Counter V8</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f1ea;
        color: #222;
        text-align: center;
    }

    .app {
        max-width: 500px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        margin-top: 10px;
        font-size: 32px;
    }

    .status {
        margin: 15px 0;
        padding: 12px;
        border-radius: 12px;
        background: #ddd;
        font-weight: bold;
    }

    .listening {
        background: #b7e4c7;
    }

    .paused {
        background: #f8d7da;
    }

    .counter-box {
        background: white;
        border-radius: 25px;
        padding: 25px;
        margin: 20px 0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .label {
        font-size: 18px;
        margin-bottom: 5px;
    }

    .count {
        font-size: 80px;
        font-weight: bold;
        margin: 10px 0;
    }

    .mala {
        font-size: 24px;
        margin: 10px;
    }

    button {
        border: none;
        border-radius: 15px;
        padding: 15px 20px;
        margin: 6px;
        font-size: 18px;
        cursor: pointer;
    }

    .start {
        width: 90%;
        font-size: 22px;
        background: #222;
        color: white;
    }

    .manual {
        background: #ddd;
    }

    .reset {
        background: #f1b0b7;
    }

    .records {
        background: white;
        border-radius: 18px;
        padding: 18px;
        margin-top: 20px;
        text-align: left;
    }

    .record {
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
    }

    .small {
        font-size: 14px;
        color: #666;
    }
</style>
</head>

<body>

<div class="app">

    <h1>ੴ Waheguru</h1>

    <div id="status" class="status paused">
        Mic is OFF
    </div>

    <div class="counter-box">

        <div class="label">Current Mala</div>

        <div id="malaCount" class="count">0</div>

        <div class="mala">
            / 108
        </div>

        <div class="small">
            Total Saved Count
        </div>

        <div id="totalCount" class="mala">
            0
        </div>

    </div>

    <button id="startBtn" class="start">
        🎙️ Start Voice Counting
    </button>

    <div>
        <button id="manualBtn" class="manual">
            ➕ Manual Count
        </button>

        <button id="resetBtn" class="reset">
            🔄 Reset Mala
        </button>
    </div>

    <div class="records">
        <h2>Daily Records</h2>
        <div id="records"></div>
    </div>

</div>

<script>

/* =========================================
   WAHEGURU VOICE COUNTER - VERSION 8
   ========================================= */

let malaCount = Number(localStorage.getItem("malaCount")) || 0;
let totalCount = Number(localStorage.getItem("totalCount")) || 0;

let listening = false;
let recognition = null;
let silenceTimer = null;

const SILENCE_TIME = 30000; // 30 seconds

const malaDisplay = document.getElementById("malaCount");
const totalDisplay = document.getElementById("totalCount");
const statusDisplay = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const manualBtn = document.getElementById("manualBtn");
const resetBtn = document.getElementById("resetBtn");
const recordsDisplay = document.getElementById("records");


/* =========================================
   DISPLAY
   ========================================= */

function updateDisplay() {

    malaDisplay.textContent = malaCount;
    totalDisplay.textContent = totalCount;

    localStorage.setItem("malaCount", malaCount);
    localStorage.setItem("totalCount", totalCount);

    showRecords();
}


/* =========================================
   COUNT ONE WAHEGURU
   ========================================= */

function addCount() {

    totalCount++;

    malaCount++;

    /*
       When mala reaches 108,
       save the completed mala and
       automatically start the next mala.
    */

    if (malaCount >= 108) {

        saveDailyRecord();

        malaCount = 0;

        // Small notification
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }
    }

    updateDisplay();
}


/* =========================================
   MANUAL COUNT
   ========================================= */

manualBtn.addEventListener("click", function() {
    addCount();
});


/* =========================================
   RESET CURRENT MALA
   ========================================= */

resetBtn.addEventListener("click", function() {

    if (confirm("Reset the current mala to 0?")) {

        malaCount = 0;

        updateDisplay();
    }
});


/* =========================================
   VOICE RECOGNITION
   ========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.lang = "en-US";


    recognition.onstart = function() {

        listening = true;

        setListeningStatus();

        /*
           Important V8 rule:

           When microphone is listening,
           the app does NOT pause.

           The 30-second timer is started
           only when listening stops.
        */

        clearTimeout(silenceTimer);
    };


    recognition.onresult = function(event) {

        /*
           Every time speech is detected,
           reset the 30-second timer.

           This means the microphone can continue
           listening while you are speaking.
        */

        clearTimeout(silenceTimer);

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            if (event.results[i].isFinal) {

                let spokenText =
                    event.results[i][0].transcript
                    .toLowerCase()
                    .trim();

                console.log("Heard:", spokenText);

                countWaheguru(spokenText);
            }
        }

        /*
           Start the 30-second countdown AFTER
           speech has been detected.
        */

        startSilenceTimer();
    };


    recognition.onerror = function(event) {

        console.log("Voice error:", event.error);

        /*
           If the browser stops listening,
           we don't immediately call it paused.
           The restart logic below attempts to
           keep listening.
        */

        if (
            event.error !== "not-allowed" &&
            event.error !== "service-not-allowed"
        ) {
            listening = false;
            setPausedStatus();
        }
    };


    recognition.onend = function() {

        listening = false;

        /*
           The microphone has stopped listening.
           Therefore V8 now allows the paused state.
        */

        setPausedStatus();

        /*
           Automatically restart if the user
           has not manually stopped it.
        */

        if (startBtn.dataset.running === "true") {

            setTimeout(function() {

                if (startBtn.dataset.running === "true") {

                    try {
                        recognition.start();
                    } catch (e) {
                        console.log(e);
                    }

                }

            }, 500);
        }
    };

} else {

    statusDisplay.textContent =
        "Voice recognition is not supported by this browser.";

    startBtn.disabled = true;
}


/* =========================================
   RECOGNIZE "WAHEGURU"
   ========================================= */

function countWaheguru(text) {

    /*
       Different ways the word may be recognized.
    */

    const words = text
        .replace(/[.,!?]/g, " ")
        .split(/\s+/)
        .filter(Boolean);

    let found = 0;

    for (let word of words) {

        word = word.toLowerCase();

        if (
            word === "waheguru" ||
            word === "waheguroo" ||
            word === "wahe guru" ||
            word.includes("waheguru")
        ) {
            found++;
        }
    }

    /*
       Also check common speech-recognition
       variations.
    */

    if (
        text.includes("wahe guru") ||
        text.includes("waheguru") ||
        text.includes("waheguroo")
    ) {

        if (found === 0) {
            found = 1;
        }
    }

    for (let i = 0; i < found; i++) {
        addCount();
    }
}


/* =========================================
   30 SECOND SILENCE TIMER
   ========================================= */

function startSilenceTimer() {

    clearTimeout(silenceTimer);

    silenceTimer = setTimeout(function() {

        /*
           Only stop the microphone after
           30 seconds without speech.
        */

        if (listening) {

            try {
                recognition.stop();
            } catch (e) {
                console.log(e);
            }

        }

    }, SILENCE_TIME);
}


/* =========================================
   START / STOP VOICE
   ========================================= */

startBtn.addEventListener("click", function() {

    if (!recognition) {
        return;
    }

    if (startBtn.dataset.running === "true") {

        /*
           User manually stops voice counting.
        */

        startBtn.dataset.running = "false";

        clearTimeout(silenceTimer);

        try {
            recognition.stop();
        } catch (e) {
            console.log(e);
        }

        listening = false;

        setPausedStatus();

    } else {

        /*
           Start voice counting.
        */

        startBtn.dataset.running = "true";

        try {
            recognition.start();
        } catch (e) {
            console.log(e);
        }

    }

});


/* =========================================
   STATUS
   ========================================= */

function setListeningStatus() {

    statusDisplay.textContent =
        "🎙️ Mic is listening";

    statusDisplay.className =
        "status listening";

    startBtn.textContent =
        "⏹️ Stop Voice Counting";
}


function setPausedStatus() {

    statusDisplay.textContent =
        "⏸️ Mic is OFF";

    statusDisplay.className =
        "status paused";

    startBtn.textContent =
        "🎙️ Start Voice Counting";
}


/* =========================================
   DAILY RECORDS
   ========================================= */

function getRecords() {

    return JSON.parse(
        localStorage.getItem("dailyRecords") || "{}"
    );

}


function saveDailyRecord() {

    const today =
        new Date().toISOString().split("T")[0];

    const records = getRecords();

    if (!records[today]) {
        records[today] = 0;
    }

    records[today] += 108;

    localStorage.setItem(
        "dailyRecords",
        JSON.stringify(records)
    );

    showRecords();
}


function showRecords() {

    const records = getRecords();

    recordsDisplay.innerHTML = "";

    const dates = Object.keys(records)
        .sort()
        .reverse();

    if (dates.length === 0) {

        recordsDisplay.innerHTML =
            "<div class='small'>No completed malas yet.</div>";

        return;
    }

    dates.forEach(function(date) {

        const div =
            document.createElement("div");

        div.className = "record";

        div.textContent =
            date + " — " +
            records[date] +
            " counts";

        recordsDisplay.appendChild(div);
    });
}


/* =========================================
   MIDNIGHT MALA RESET
   ========================================= */

function checkMidnightReset() {

    const today =
        new Date().toISOString().split("T")[0];

    const lastDate =
        localStorage.getItem("lastDate");

    if (!lastDate) {

        localStorage.setItem(
            "lastDate",
            today
        );

        return;
    }

    if (lastDate !== today) {

        /*
           New day:
           reset CURRENT mala only.

           Saved total remains.
        */

        malaCount = 0;

        localStorage.setItem(
            "lastDate",
            today
        );

        updateDisplay();
    }
}


/* =========================================
   MIDNIGHT CHECK
   ========================================= */

setInterval(
    checkMidnightReset,
    1000
);


/* =========================================
   INITIALIZE
   ========================================= */

checkMidnightReset();

updateDisplay();

</script>

</body>
</html>
