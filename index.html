<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waheguru Voice Counter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f1e8;
  color: #222;
  text-align: center;
}

body.dark {
  background: #111;
  color: #eee;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 18px;
}

h1 {
  margin: 5px 0;
  font-size: 28px;
}

.subtitle {
  margin-bottom: 15px;
  opacity: .7;
}

.mala-box {
  position: relative;
  width: min(90vw, 430px);
  height: min(90vw, 430px);
  margin: 10px auto;
}

.bead {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #c9c0ae;
  transform: translate(-50%, -50%);
  transition: .2s;
}

.bead.active {
  background: #8b5e34;
  box-shadow: 0 0 8px rgba(139,94,52,.5);
}

.bead.guru {
  width: 28px;
  height: 28px;
  background: #b8860b;
}

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.progress {
  font-size: 42px;
  font-weight: bold;
}

.mala-number {
  font-size: 20px;
  margin-top: 5px;
}

.status {
  min-height: 30px;
  margin: 10px;
  font-size: 17px;
}

.heard {
  min-height: 24px;
  font-size: 15px;
  opacity: .7;
}

button, select {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

.start {
  background: #315c3b;
  color: white;
}

.pause {
  background: #777;
  color: white;
}

.reset {
  background: #9b3d35;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 18px 0;
}

.stat {
  background: rgba(255,255,255,.65);
  padding: 14px;
  border-radius: 15px;
}

.dark .stat {
  background: #222;
}

.stat-number {
  font-size: 25px;
  font-weight: bold;
}

.calendar {
  margin-top: 20px;
  padding: 15px;
  border-radius: 15px;
  background: rgba(255,255,255,.65);
}

.dark .calendar {
  background: #222;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  margin-top: 10px;
}

.day {
  padding: 8px 2px;
  border-radius: 8px;
  font-size: 13px;
  min-height: 40px;
}

.day.has-jaap {
  background: #d8c49b;
  font-weight: bold;
}

.dark .day.has-jaap {
  background: #66552e;
}

.controls {
  margin-top: 10px;
}

.small {
  font-size: 13px;
  opacity: .65;
  margin-top: 15px;
}

.complete {
  animation: pulse .7s ease-in-out 2;
}

@keyframes pulse {
  50% {
    transform: scale(1.05);
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🙏 Waheguru Voice Counter</h1>
<div class="subtitle">108-Bead Digital Mala</div>

<div class="mala-box" id="mala"></div>

<div class="center">
  <div class="progress" id="progress">0 / 108</div>
  <div class="mala-number" id="malaNumber">Mala 0</div>
</div>

<div class="status" id="status">Press Start and say “Waheguru”</div>
<div class="heard" id="heard">Heard: —</div>

<div class="controls">
  <button class="start" onclick="startListening()">🎙️ Start</button>
  <button class="pause" onclick="pauseListening()">⏸ Pause</button>
  <button class="reset" onclick="resetCurrentMala()">↻ Reset Mala</button>
</div>

<div>
  <select id="language">
    <option value="en-US">English</option>
    <option value="pa-IN">Punjabi</option>
    <option value="hi-IN">Hindi</option>
  </select>

  <button onclick="toggleDark()">🌙 Dark Mode</button>
</div>

<div class="stats">

  <div class="stat">
    <div>Completed Malas</div>
    <div class="stat-number" id="completedMalas">0</div>
  </div>

  <div class="stat">
    <div>Total Jaap</div>
    <div class="stat-number" id="total">0</div>
  </div>

  <div class="stat">
    <div>Today</div>
    <div class="stat-number" id="today">0</div>
  </div>

  <div class="stat">
    <div>Current Mala</div>
    <div class="stat-number" id="current">0</div>
  </div>

</div>

<div class="calendar">
  <h2>📅 Daily Records</h2>
  <div id="monthTitle"></div>
  <div class="calendar-grid" id="calendar"></div>
</div>

<div class="small">
  Your records are saved on this device.
</div>

</div>

<script>

const TOTAL_BEADS = 108;

let currentCount =
  Number(localStorage.getItem("wg_count") || 0);

let total =
  Number(localStorage.getItem("wg_total") || 0);

let completedMalas =
  Number(localStorage.getItem("wg_malas") || 0);

let records =
  JSON.parse(localStorage.getItem("wg_records") || "{}");

let listening = false;

let recognition = null;

let lastCanonical = "";

let lastRecognitionTime = 0;


/* =========================
   CREATE 108 BEADS
========================= */

function createMala() {

  const mala = document.getElementById("mala");

  mala.innerHTML = "";

  const size = mala.clientWidth;
  const center = size / 2;
  const radius = size * 0.40;

  for (let i = 0; i < TOTAL_BEADS; i++) {

    const bead = document.createElement("div");

    bead.className = "bead";

    const angle =
      (i / TOTAL_BEADS) * Math.PI * 2 - Math.PI / 2;

    const x =
      center + Math.cos(angle) * radius;

    const y =
      center + Math.sin(angle) * radius;

    bead.style.left = x + "px";
    bead.style.top = y + "px";

    if (i === 0) {
      bead.classList.add("guru");
    }

    bead.id = "bead-" + i;

    mala.appendChild(bead);
  }

  updateBeads();
}


/* =========================
   UPDATE BEADS
========================= */

function updateBeads() {

  for (let i = 0; i < TOTAL_BEADS; i++) {

    const bead =
      document.getElementById("bead-" + i);

    if (!bead) continue;

    bead.classList.toggle(
      "active",
      i < currentCount
    );
  }

  document.getElementById("progress").textContent =
    currentCount + " / 108";

  document.getElementById("malaNumber").textContent =
    "Mala " + (completedMalas + 1);

  document.getElementById("completedMalas").textContent =
    completedMalas;

  document.getElementById("total").textContent =
    total;

  document.getElementById("current").textContent =
    currentCount;

  updateToday();

  saveData();
}


/* =========================
   DATE
========================= */

function getTodayKey() {

  const d = new Date();

  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}


/* =========================
   ADD JAAP
========================= */

function addJaap(amount) {

  if (!amount || amount < 1) return;

  const today = getTodayKey();

  if (!records[today]) {
    records[today] = 0;
  }

  for (let i = 0; i < amount; i++) {

    currentCount++;
    total++;
    records[today]++;

    if (currentCount >= TOTAL_BEADS) {

      currentCount = 0;

      completedMalas++;

      speakCompletion();

      showCompletion();
    }
  }

  updateBeads();

  renderCalendar();
}


/* =========================
   MALA COMPLETE
========================= */

function speakCompletion() {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const message =
    "Mala " + completedMalas + " complete";

  const speech =
    new SpeechSynthesisUtterance(message);

  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}


function showCompletion() {

  const box =
    document.querySelector(".mala-box");

  box.classList.add("complete");

  setTimeout(() => {
    box.classList.remove("complete");
  }, 1500);

  document.getElementById("status").textContent =
    "🙏 Mala " + completedMalas + " complete";
}


/* =========================
   NORMALIZE SPEECH
========================= */

function canonicalize(text) {

  let s = text.toLowerCase();

  s = s.replace(/[.,!?;:]/g, " ");

  /*
     Punjabi spellings
  */

  s = s.replace(
    /ਵਾਹਿਗੁਰੂ|ਵਾਹੇਗੁਰੂ|ਵਾਹੇ ਗੁਰੂ|ਵਾਹਿਗੁਰੁ/g,
    " waheguru "
  );

  /*
     English variations
  */

  s = s.replace(
    /wahe\s+guroo|wahe\s+guro|waheguroo|waheguro|wahe\s+guru/g,
    " waheguru "
  );

  /*
     Remove everything except letters,
     spaces and the Punjabi characters
  */

  s = s.replace(/[^a-z\u0A00-\u0A7F\s]/g, " ");

  s = s.replace(/\s+/g, " ").trim();

  return s;
}


/* =========================
   COUNT WAHEGURU WORDS
========================= */

function countWaheguru(text) {

  const canonical = canonicalize(text);

  if (!canonical) return 0;

  const matches =
    canonical.match(/waheguru/g);

  return matches ? matches.length : 0;
}


/* =========================
   SPEECH RECOGNITION
========================= */

function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    document.getElementById("status").textContent =
      "Speech recognition is not supported in this browser.";

    return null;
  }

  const r = new SpeechRecognition();

  r.continuous = true;

  r.interimResults = false;

  r.maxAlternatives = 1;

  r.lang =
    document.getElementById("language").value;

  r.onstart = function() {

    listening = true;

    document.getElementById("status").textContent =
      "🎙️ Listening… Say Waheguru";
  };


  r.onresult = function(event) {

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (!event.results[i].isFinal) continue;

      const text =
        event.results[i][0].transcript.trim();

      const canonical =
        canonicalize(text);

      const now = Date.now();

      /*
         Ignore the exact same recognition
         result repeated immediately by browser.
      */

      if (
        canonical === lastCanonical &&
        now - lastRecognitionTime < 2500
      ) {
        continue;
      }

      lastCanonical = canonical;
      lastRecognitionTime = now;

      const amount =
        countWaheguru(text);

      document.getElementById("heard").textContent =
        "Heard: " + text +
        (amount ? "  (+" + amount + ")" : "");

      if (amount > 0) {

        addJaap(amount);

      } else {

        document.getElementById("status").textContent =
          "Listening… I didn't hear Waheguru.";
      }
    }
  };


  r.onerror = function(event) {

    if (event.error === "not-allowed") {

      document.getElementById("status").textContent =
        "Microphone permission is required.";

      listening = false;

      return;
    }

    if (listening) {

      document.getElementById("status").textContent =
        "Listening…";

    }
  };


  r.onend = function() {

    if (listening) {

      setTimeout(() => {

        try {
          r.start();
        } catch(e) {}

      }, 300);
    }
  };


  return r;
}


/* =========================
   START
========================= */

function startListening() {

  if (!recognition) {

    recognition = setupRecognition();

    if (!recognition) return;
  }

  recognition.lang =
    document.getElementById("language").value;

  listening = true;

  try {
    recognition.start();
  } catch(e) {}

  document.getElementById("status").textContent =
    "🎙️ Listening… Say Waheguru";
}


/* =========================
   PAUSE
========================= */

function pauseListening() {

  listening = false;

  if (recognition) {

    try {
      recognition.stop();
    } catch(e) {}
  }

  document.getElementById("status").textContent =
    "⏸ Paused";
}


/* =========================
   RESET CURRENT MALA
========================= */

function resetCurrentMala() {

  if (
    !confirm(
      "Reset the current mala progress?"
    )
  ) return;

  currentCount = 0;

  updateBeads();

  document.getElementById("status").textContent =
    "Current mala reset.";
}


/* =========================
   TODAY
========================= */

function updateToday() {

  const today =
    getTodayKey();

  document.getElementById("today").textContent =
    records[today] || 0;
}


/* =========================
   SAVE
========================= */

function saveData() {

  localStorage.setItem(
    "wg_count",
    currentCount
  );

  localStorage.setItem(
    "wg_total",
    total
  );

  localStorage.setItem(
    "wg_malas",
    completedMalas
  );

  localStorage.setItem(
    "wg_records",
    JSON.stringify(records)
  );
}


/* =========================
   CALENDAR
========================= */

function renderCalendar() {

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth();

  const monthName =
    now.toLocaleString(
      "default",
      {
        month: "long",
        year: "numeric"
      }
    );

  document.getElementById("monthTitle").textContent =
    monthName;

  const firstDay =
    new Date(year, month, 1).getDay();

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  const names =
    ["S","M","T","W","T","F","S"];

  names.forEach(name => {

    const d =
      document.createElement("div");

    d.className = "day";

    d.textContent = name;

    calendar.appendChild(d);
  });

  for (let i = 0; i < firstDay; i++) {

    const blank =
      document.createElement("div");

    blank.className = "day";

    calendar.appendChild(blank);
  }

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const d =
      document.createElement("div");

    d.className = "day";

    const key =
      year + "-" +
      String(month + 1).padStart(2, "0") +
      "-" +
      String(day).padStart(2, "0");

    const amount =
      records[key] || 0;

    d.innerHTML =
      "<strong>" + day + "</strong>" +
      (amount ? "<br>" + amount : "");

    if (amount) {

      d.classList.add("has-jaap");

      d.title =
        amount + " Waheguru";
    }

    calendar.appendChild(d);
  }
}


/* =========================
   DARK MODE
========================= */

function toggleDark() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "wg_dark",
    document.body.classList.contains("dark")
  );
}


/* =========================
   KEEP SCREEN AWAKE
========================= */

let wakeLock = null;

async function keepScreenAwake() {

  if (!("wakeLock" in navigator)) return;

  try {

    wakeLock =
      await navigator.wakeLock.request("screen");

  } catch(e) {}
}


/* =========================
   LANGUAGE CHANGE
========================= */

document
  .getElementById("language")
  .addEventListener("change", function() {

    if (recognition) {

      recognition.lang = this.value;
    }
  });


/* =========================
   STARTUP
========================= */

window.addEventListener("load", function() {

  if (
    localStorage.getItem("wg_dark") === "true"
  ) {
    document.body.classList.add("dark");
  }

  createMala();

  updateBeads();

  renderCalendar();

  keepScreenAwake();
});


window.addEventListener(
  "resize",
  createMala
);

</script>

</body>
</html>
