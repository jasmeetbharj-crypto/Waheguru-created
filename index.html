<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waheguru Voice Counter - Version 6</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f1e8;
    color: #222;
    text-align: center;
}

body.dark {
    background: #111;
    color: #eee;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 18px;
}

h1 {
    margin: 5px 0;
    font-size: 28px;
}

.subtitle {
    opacity: .7;
    margin-bottom: 10px;
}

/* MALA */

.mala-box {
    position: relative;
    width: min(90vw, 430px);
    height: min(90vw, 430px);
    margin: 10px auto;
}

.bead {
    position: absolute;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #c8c0b1;
    transform: translate(-50%, -50%);
    transition: .18s;
}

.bead.active {
    background: #8b5e34;
    box-shadow: 0 0 8px rgba(139,94,52,.5);
}

.bead.guru {
    width: 27px;
    height: 27px;
    background: #b8860b;
}

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.progress {
    font-size: 38px;
    font-weight: bold;
}

.mala-number {
    font-size: 20px;
    margin-top: 5px;
}

/* STATUS */

.status {
    min-height: 30px;
    font-size: 17px;
    margin: 8px;
}

.heard {
    min-height: 25px;
    font-size: 15px;
    opacity: .7;
}

/* BUTTONS */

button,
select {
    border: none;
    border-radius: 12px;
    padding: 12px 17px;
    margin: 5px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

.start {
    background: #315c3b;
    color: white;
}

.pause {
    background: #777;
    color: white;
}

.reset {
    background: #9b3d35;
    color: white;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 18px 0;
}

.stat {
    background: rgba(255,255,255,.65);
    padding: 14px;
    border-radius: 15px;
}

.dark .stat {
    background: #222;
}

.stat-number {
    font-size: 25px;
    font-weight: bold;
}

/* CALENDAR */

.calendar {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,.65);
}

.dark .calendar {
    background: #222;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 10px;
}

.day {
    padding: 8px 2px;
    border-radius: 8px;
    min-height: 40px;
    font-size: 13px;
}

.day.has-jaap {
    background: #d8c49b;
    font-weight: bold;
}

.dark .day.has-jaap {
    background: #66552e;
}

.small {
    margin-top: 15px;
    font-size: 13px;
    opacity: .6;
}

.complete {
    animation: pulse .7s ease-in-out 2;
}

@keyframes pulse {
    50% {
        transform: scale(1.05);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🙏 Waheguru Voice Counter</h1>

<div class="subtitle">
    108-Bead Digital Mala
</div>

<div class="mala-box" id="mala"></div>

<div class="center">
    <div class="progress" id="progress">
        0 / 108
    </div>

    <div class="mala-number" id="malaNumber">
        Mala 1
    </div>
</div>

<div class="status" id="status">
    Press Start and say “Waheguru”
</div>

<div class="heard" id="heard">
    Heard: —
</div>

<div>

    <button class="start" onclick="startListening()">
        🎙️ Start
    </button>

    <button class="pause" onclick="pauseListening()">
        ⏸ Pause
    </button>

    <button class="reset" onclick="resetCurrentMala()">
        ↻ Reset Mala
    </button>

</div>

<div>

<select id="language">
    <option value="en-US">English</option>
    <option value="pa-IN">Punjabi</option>
    <option value="hi-IN">Hindi</option>
</select>

<button onclick="toggleDark()">
    🌙 Dark Mode
</button>

</div>

<div class="stats">

    <div class="stat">
        <div>Completed Malas</div>
        <div class="stat-number" id="completedMalas">0</div>
    </div>

    <div class="stat">
        <div>Total Jaap</div>
        <div class="stat-number" id="total">0</div>
    </div>

    <div class="stat">
        <div>Today</div>
        <div class="stat-number" id="today">0</div>
    </div>

    <div class="stat">
        <div>Current Mala</div>
        <div class="stat-number" id="current">0</div>
    </div>

</div>

<div class="calendar">

    <h2>📅 Daily Records</h2>

    <div id="monthTitle"></div>

    <div class="calendar-grid" id="calendar"></div>

</div>

<div class="small">
    Version 6 • Records are saved on this device.
</div>

</div>


<script>

/* =====================================================
   BASIC DATA
===================================================== */

const TOTAL_BEADS = 108;

let currentCount =
    Number(localStorage.getItem("wg_count") || 0);

let total =
    Number(localStorage.getItem("wg_total") || 0);

let completedMalas =
    Number(localStorage.getItem("wg_malas") || 0);

let records =
    JSON.parse(localStorage.getItem("wg_records") || "{}");

let recognition = null;

let listening = false;


/*
   IMPORTANT VERSION 6 CHANGE

   Instead of saying:

       "same word = duplicate"

   we remember which speech-recognition result
   positions have already been processed.

   This means:

       Waheguru
       Waheguru
       Waheguru

   can all count separately.
*/

let processedResults = new Map();


/* =====================================================
   CREATE MALA
===================================================== */

function createMala() {

    const mala = document.getElementById("mala");

    mala.innerHTML = "";

    const size = mala.clientWidth;

    const center = size / 2;

    const radius = size * 0.40;

    for (let i = 0; i < TOTAL_BEADS; i++) {

        const bead = document.createElement("div");

        bead.className = "bead";

        if (i === 0) {
            bead.classList.add("guru");
        }

        const angle =
            (i / TOTAL_BEADS) *
            Math.PI * 2 -
            Math.PI / 2;

        const x =
            center +
            Math.cos(angle) * radius;

        const y =
            center +
            Math.sin(angle) * radius;

        bead.style.left = x + "px";

        bead.style.top = y + "px";

        bead.id = "bead-" + i;

        mala.appendChild(bead);
    }

    updateBeads();
}


/* =====================================================
   UPDATE MALA
===================================================== */

function updateBeads() {

    for (let i = 0; i < TOTAL_BEADS; i++) {

        const bead =
            document.getElementById("bead-" + i);

        if (!bead) continue;

        bead.classList.toggle(
            "active",
            i < currentCount
        );
    }

    document.getElementById("progress").textContent =
        currentCount + " / 108";

    document.getElementById("malaNumber").textContent =
        "Mala " + (completedMalas + 1);

    document.getElementById("completedMalas").textContent =
        completedMalas;

    document.getElementById("total").textContent =
        total;

    document.getElementById("current").textContent =
        currentCount;

    updateToday();

    saveData();
}


/* =====================================================
   DATE
===================================================== */

function getTodayKey() {

    const d = new Date();

    return d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");
}


/* =====================================================
   ADD JAAP
===================================================== */

function addJaap(amount) {

    if (!amount || amount < 1) {
        return;
    }

    const today =
        getTodayKey();

    if (!records[today]) {
        records[today] = 0;
    }

    for (let i = 0; i < amount; i++) {

        currentCount++;

        total++;

        records[today]++;

        /*
           When 108 is reached:
        */

        if (currentCount >= TOTAL_BEADS) {

            currentCount = 0;

            completedMalas++;

            /*
               Speak ONCE for this completed mala.
            */

            announceMalaComplete();

            showMalaComplete();
        }
    }

    updateBeads();

    renderCalendar();
}


/* =====================================================
   MALA COMPLETE
===================================================== */

function announceMalaComplete() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const text =
        "Mala " +
        completedMalas +
        " complete";

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.rate = 0.9;

    voice.pitch = 1;

    window.speechSynthesis.speak(voice);
}


function showMalaComplete() {

    const box =
        document.querySelector(".mala-box");

    box.classList.add("complete");

    setTimeout(function() {

        box.classList.remove("complete");

    }, 1500);

    document.getElementById("status").textContent =
        "🙏 Mala " +
        completedMalas +
        " complete";
}


/* =====================================================
   NORMALIZE SPEECH
===================================================== */

function normalizeSpeech(text) {

    let s =
        text.toLowerCase();

    /*
       Remove punctuation.
    */

    s =
        s.replace(/[.,!?;:]/g, " ");

    /*
       Punjabi forms.
    */

    s =
        s.replace(
            /ਵਾਹਿਗੁਰੂ|ਵਾਹੇਗੁਰੂ|ਵਾਹੇ ਗੁਰੂ|ਵਾਹਿਗੁਰੁ/g,
            " waheguru "
        );

    /*
       English variations.

       All of these become:

           waheguru
    */

    s =
        s.replace(
            /wahe\s+guroo|wahe\s+guro|waheguroo|waheguro|wahe\s+guru/g,
            " waheguru "
        );

    /*
       Keep normal English letters.
    */

    s =
        s.replace(
            /[^a-z\u0A00-\u0A7F\s]/g,
            " "
        );

    s =
        s.replace(/\s+/g, " ").trim();

    return s;
}


/* =====================================================
   COUNT EVERY WAHEGURU
===================================================== */

function countWaheguru(text) {

    const normalized =
        normalizeSpeech(text);

    if (!normalized) {
        return 0;
    }

    const matches =
        normalized.match(/waheguru/g);

    return matches
        ? matches.length
        : 0;
}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function createRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("status").textContent =
            "Speech recognition is not supported.";

        return null;
    }

    const r =
        new SpeechRecognition();

    /*
       CONTINUOUS IS IMPORTANT.
    */

    r.continuous = true;

    /*
       FINAL RESULTS ONLY.

       This prevents interim speech from
       being counted multiple times.
    */

    r.interimResults = false;

    r.maxAlternatives = 1;

    r.lang =
        document.getElementById("language").value;


    /* ---------------------------------------------
       START
    --------------------------------------------- */

    r.onstart = function() {

        listening = true;

        document.getElementById("status").textContent =
            "🎙️ Listening… Say Waheguru";
    };


    /* ---------------------------------------------
       RESULTS
    --------------------------------------------- */

    r.onresult = function(event) {

        /*
           Process every NEW final result.

           We DO NOT reject repeated words just
           because the transcript is identical.
        */

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const result =
                event.results[i];

            if (!result.isFinal) {
                continue;
            }

            /*
               Use the result index as the identity.

               This is the key Version 6 fix.
            */

            const resultText =
                result[0].transcript.trim();

            const normalized =
                normalizeSpeech(resultText);

            const resultKey =
                i + "|" + normalized;

            /*
               If exactly this recognition result
               was already processed, ignore it.

               But another result containing the
               exact same word IS allowed.
            */

            if (processedResults.has(resultKey)) {
                continue;
            }

            processedResults.set(
                resultKey,
                Date.now()
            );


            /*
               Keep the map small.
            */

            if (processedResults.size > 200) {

                const firstKey =
                    processedResults.keys().next().value;

                processedResults.delete(firstKey);
            }


            /*
               Count ALL occurrences.
            */

            const amount =
                countWaheguru(resultText);


            document.getElementById("heard").textContent =
                "Heard: " +
                resultText +
                (amount > 0
                    ? "  (+" + amount + ")"
                    : "");


            /*
               Add every recognized occurrence.
            */

            if (amount > 0) {

                addJaap(amount);

            } else {

                document.getElementById("status").textContent =
                    "🎙️ Listening…";
            }
        }
    };


    /* ---------------------------------------------
       ERRORS
    --------------------------------------------- */

    r.onerror = function(event) {

        if (event.error === "not-allowed") {

            listening = false;

            document.getElementById("status").textContent =
                "Microphone permission is required.";

            return;
        }

        /*
           Some browsers report temporary errors.
        */

        if (listening) {

            document.getElementById("status").textContent =
                "🎙️ Listening…";
        }
    };


    /* ---------------------------------------------
       END
    --------------------------------------------- */

    r.onend = function() {

        /*
           Automatically restart while the user
           has not pressed Pause.
        */

        if (listening) {

            setTimeout(function() {

                try {

                    r.start();

                } catch (e) {

                    /*
                       Browser may already be starting.
                    */

                }

            }, 300);
        }
    };


    return r;
}


/* =====================================================
   START LISTENING
===================================================== */

function startListening() {

    if (!recognition) {

        recognition =
            createRecognition();

        if (!recognition) {
            return;
        }
    }

    recognition.lang =
        document.getElementById("language").value;

    listening = true;

    /*
       IMPORTANT:

       Do NOT clear processed results here.

       This allows continuous speech recognition
       to keep working correctly.
    */

    try {

        recognition.start();

    } catch (e) {

        /*
           Already running.
        */
    }

    document.getElementById("status").textContent =
        "🎙️ Listening… Say Waheguru";
}


/* =====================================================
   PAUSE
===================================================== */

function pauseListening() {

    listening = false;

    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}
    }

    /*
       Clear old result identities when a session
       is intentionally paused.

       When started again, new speech is treated
       as a new session.
    */

    processedResults.clear();

    document.getElementById("status").textContent =
        "⏸ Paused";
}


/* =====================================================
   RESET CURRENT MALA
===================================================== */

function resetCurrentMala() {

    if (
        !confirm(
            "Reset the current mala progress?"
        )
    ) {
        return;
    }

    currentCount = 0;

    updateBeads();

    document.getElementById("status").textContent =
        "Current mala reset.";
}


/* =====================================================
   TODAY
===================================================== */

function updateToday() {

    const today =
        getTodayKey();

    document.getElementById("today").textContent =
        records[today] || 0;
}


/* =====================================================
   SAVE
===================================================== */

function saveData() {

    localStorage.setItem(
        "wg_count",
        currentCount
    );

    localStorage.setItem(
        "wg_total",
        total
    );

    localStorage.setItem(
        "wg_malas",
        completedMalas
    );

    localStorage.setItem(
        "wg_records",
        JSON.stringify(records)
    );
}


/* =====================================================
   CALENDAR
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth();

    const monthName =
        now.toLocaleString(
            "default",
            {
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById("monthTitle").textContent =
        monthName;


    /*
       Weekday headings.
    */

    const names =
        ["S","M","T","W","T","F","S"];

    names.forEach(function(name) {

        const d =
            document.createElement("div");

        d.className = "day";

        d.textContent = name;

        calendar.appendChild(d);
    });


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /*
       Empty spaces before day 1.
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const blank =
            document.createElement("div");

        blank.className = "day";

        calendar.appendChild(blank);
    }


    /*
       Days.
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const d =
            document.createElement("div");

        d.className = "day";

        const key =
            year +
            "-" +
            String(month + 1).padStart(2, "0") +
            "-" +
            String(day).padStart(2, "0");

        const amount =
            records[key] || 0;

        d.innerHTML =
            "<strong>" +
            day +
            "</strong>" +
            (
                amount
                ? "<br>" + amount
                : ""
            );


        if (amount) {

            d.classList.add(
                "has-jaap"
            );

            d.title =
                amount +
                " Waheguru";
        }

        calendar.appendChild(d);
    }
}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDark() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "wg_dark",
        document.body.classList.contains("dark")
    );
}


/* =====================================================
   SCREEN WAKE LOCK
===================================================== */

let wakeLock = null;

async function keepScreenAwake() {

    if (!("wakeLock" in navigator)) {
        return;
    }

    try {

        wakeLock =
            await navigator.wakeLock.request("screen");

    } catch (e) {}
}


/* =====================================================
   LANGUAGE
===================================================== */

document
    .getElementById("language")
    .addEventListener(
        "change",
        function() {

            if (recognition) {

                recognition.lang =
                    this.value;
            }
        }
    );


/* =====================================================
   STARTUP
===================================================== */

window.addEventListener(
    "load",
    function() {

        if (
            localStorage.getItem("wg_dark") === "true"
        ) {

            document.body.classList.add("dark");
        }

        createMala();

        updateBeads();

        renderCalendar();

        keepScreenAwake();
    }
);


window.addEventListener(
    "resize",
    createMala
);

</script>

</body>
</html>
