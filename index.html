<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waheguru Voice Counter</title>

<style>
:root {
    --accent: #e53935;
    --bg: #080808;
    --card: #151515;
    --text: #ffffff;
    --muted: #999999;
    --border: #292929;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition: 0.3s;
}

body.light {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #111111;
    --muted: #666666;
    --border: #dddddd;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 18px 15px 40px;
}

header {
    text-align: center;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: 27px;
}

.subtitle {
    color: var(--muted);
    margin-top: 5px;
    font-size: 14px;
}

/* TOP CONTROLS */

.top-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 15px 0;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    padding: 9px 13px;
    cursor: pointer;
    font-size: 18px;
}

/* MIC STATUS */

.status {
    text-align: center;
    margin-bottom: 15px;
}

.status-pill {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 30px;
    background: #292929;
    color: #aaa;
    font-size: 13px;
}

.status-pill.listening {
    background: var(--accent);
    color: white;
}

/* MALA */

.mala-area {
    position: relative;
    width: 330px;
    height: 330px;
    margin: 5px auto 20px;
}

.mala {
    position: absolute;
    inset: 0;
}

.bead {
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #333;
    transform: translate(-50%, -50%);
    transition: 0.2s;
}

.bead.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}

/* CENTER */

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 205px;
    height: 205px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.ik-onkar {
    position: absolute;
    font-size: 115px;
    font-weight: bold;
    opacity: 0.08;
    z-index: 0;
    pointer-events: none;
}

.count {
    position: relative;
    z-index: 2;
    font-size: 68px;
    font-weight: bold;
    line-height: 1;
}

.mala-number {
    position: relative;
    z-index: 2;
    margin-top: 9px;
    color: var(--muted);
    font-size: 15px;
}

/* COLOR BUTTON */

.color-button {
    position: absolute;
    z-index: 5;
    right: 23px;
    bottom: 25px;
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 50%;
    cursor: pointer;
    font-size: 19px;
}

.color-menu {
    display: none;
    position: absolute;
    z-index: 20;
    right: 0;
    bottom: -55px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    gap: 7px;
}

.color-menu.show {
    display: flex;
}

.color-option {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
}

.color-option.selected {
    border-color: white;
}

/* TIMER */

.timer-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px;
    text-align: center;
    margin-bottom: 15px;
}

.timer-title {
    color: var(--muted);
    font-size: 12px;
}

.timer {
    font-size: 20px;
    margin-top: 5px;
    font-weight: bold;
}

/* BUTTONS */

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

button {
    font-family: inherit;
}

.control-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 5px;
    font-size: 14px;
    cursor: pointer;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
}

.start {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

/* MANUAL */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
}

.card-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.manual-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.manual-buttons button {
    padding: 11px 3px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
}

.stat-label {
    font-size: 11px;
    color: var(--muted);
}

.stat-value {
    margin-top: 5px;
    font-size: 21px;
    font-weight: bold;
}

/* DAILY */

.daily-records {
    max-height: 260px;
    overflow-y: auto;
}

.day-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

.day-row:last-child {
    border-bottom: none;
}

.day-count {
    font-weight: bold;
    color: var(--accent);
}

.empty {
    color: var(--muted);
    text-align: center;
    padding: 10px;
    font-size: 13px;
}

/* RESPONSIVE */

@media(max-width:380px) {
    .mala-area {
        width: 300px;
        height: 300px;
    }

    .center {
        width: 185px;
        height: 185px;
    }

    .count {
        font-size: 58px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>Waheguru Voice Counter</h1>
    <div class="subtitle">Digital 108-Bead Mala</div>
</header>

<div class="top-controls">
    <button class="icon-btn" id="darkModeBtn" title="Dark Mode">🌙</button>
</div>

<div class="status">
    <span class="status-pill" id="statusPill">
        Microphone Off
    </span>
</div>

<!-- MALA -->

<div class="mala-area">

    <div class="mala" id="mala"></div>

    <div class="center">

        <!-- IK ONKAR -->
        <div class="ik-onkar">ੴ</div>

        <!-- CURRENT COUNT ONLY -->
        <div class="count" id="count">0</div>

        <!-- SEPARATE MALA NUMBER -->
        <div class="mala-number" id="malaNumber">
            Mala #1
        </div>

    </div>

    <!-- COLOR ICON -->
    <button class="color-button" id="colorButton">
        🎨
    </button>

    <div class="color-menu" id="colorMenu">

        <button
            class="color-option selected"
            style="background:#e53935"
            data-color="#e53935">
        </button>

        <button
            class="color-option"
            style="background:#ff9800"
            data-color="#ff9800">
        </button>

        <button
            class="color-option"
            style="background:#4caf50"
            data-color="#4caf50">
        </button>

        <button
            class="color-option"
            style="background:#2196f3"
            data-color="#2196f3">
        </button>

        <button
            class="color-option"
            style="background:#9c27b0"
            data-color="#9c27b0">
        </button>

        <button
            class="color-option"
            style="background:#ffffff"
            data-color="#ffffff">
        </button>

    </div>

</div>

<!-- TIMER -->

<div class="timer-box">

    <div class="timer-title">
        Automatic microphone timer
    </div>

    <div class="timer" id="timer">
        Waiting for voice
    </div>

</div>

<!-- MAIN CONTROLS -->

<div class="controls">

    <button class="control-btn start" id="startBtn">
        🎙️ Start
    </button>

    <button class="control-btn" id="pauseBtn">
        ⏸ Pause
    </button>

    <button class="control-btn" id="resetBtn">
        🔄 Reset Mala
    </button>

</div>

<!-- MANUAL COUNT -->

<div class="card">

    <div class="card-title">
        Manual Count
    </div>

    <div class="manual-buttons">

        <button onclick="manualAdd(1)">+1</button>
        <button onclick="manualAdd(10)">+10</button>
        <button onclick="manualAdd(27)">+27</button>
        <button onclick="manualAdd(108)">+108</button>

    </div>

</div>

<!-- STATS -->

<div class="card">

    <div class="card-title">
        Saved Records
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">Completed Malas</div>
            <div class="stat-value" id="completedMalas">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Saved Total</div>
            <div class="stat-value" id="savedTotal">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Today</div>
            <div class="stat-value" id="todayTotal">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Current Mala</div>
            <div class="stat-value" id="currentMalaStat">0</div>
        </div>

    </div>

</div>

<!-- DAILY RECORDS -->

<div class="card">

    <div class="card-title">
        📅 Daily Records
    </div>

    <div class="daily-records" id="dailyRecords">
        <div class="empty">
            No daily records yet
        </div>
    </div>

</div>

</div>

<script>

/* =========================================================
   WAHEGURU VOICE COUNTER — VERSION 8.1
   ========================================================= */

const MALA_SIZE = 108;
const SILENCE_TIME = 30000;

/*
   Lower threshold makes the microphone more sensitive
   to quiet speech.
*/
const AUDIO_THRESHOLD = 0.015;


/* =========================
   STORAGE
   ========================= */

let count = Number(localStorage.getItem("wg_count")) || 0;
let savedTotal = Number(localStorage.getItem("wg_total")) || 0;
let completedMalas =
    Number(localStorage.getItem("wg_completed_malas")) || 0;

let malaNumber =
    Number(localStorage.getItem("wg_mala_number")) || 1;

let records =
    JSON.parse(localStorage.getItem("wg_daily_records") || "{}");

let accent =
    localStorage.getItem("wg_color") || "#e53935";

let darkMode =
    localStorage.getItem("wg_dark_mode") !== "false";

let savedDate =
    localStorage.getItem("wg_date") ||
    getToday();


/* =========================
   VOICE VARIABLES
   ========================= */

let recognition = null;

let listening = false;
let recognitionRunning = false;
let recognitionStarting = false;

let recognitionRestartTimer = null;

let micStream = null;
let audioContext = null;
let analyser = null;
let audioData = null;
let audioMonitor = null;

let lastActivityAt = 0;


/* =========================
   ELEMENTS
   ========================= */

const countEl =
    document.getElementById("count");

const malaNumberEl =
    document.getElementById("malaNumber");

const malaEl =
    document.getElementById("mala");

const statusPill =
    document.getElementById("statusPill");

const timerEl =
    document.getElementById("timer");

const completedMalasEl =
    document.getElementById("completedMalas");

const savedTotalEl =
    document.getElementById("savedTotal");

const todayTotalEl =
    document.getElementById("todayTotal");

const currentMalaStatEl =
    document.getElementById("currentMalaStat");

const dailyRecordsEl =
    document.getElementById("dailyRecords");

const colorButton =
    document.getElementById("colorButton");

const colorMenu =
    document.getElementById("colorMenu");

const darkModeBtn =
    document.getElementById("darkModeBtn");


/* =========================
   DATE
   ========================= */

function getToday() {
    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}


/* =========================
   MIDNIGHT RESET
   ========================= */

function checkMidnightReset() {

    const today = getToday();

    if (savedDate !== today) {

        count = 0;

        savedDate = today;

        localStorage.setItem(
            "wg_count",
            count
        );

        localStorage.setItem(
            "wg_date",
            savedDate
        );
    }
}


/* =========================
   SAVE
   ========================= */

function save() {

    localStorage.setItem(
        "wg_count",
        count
    );

    localStorage.setItem(
        "wg_total",
        savedTotal
    );

    localStorage.setItem(
        "wg_completed_malas",
        completedMalas
    );

    localStorage.setItem(
        "wg_mala_number",
        malaNumber
    );

    localStorage.setItem(
        "wg_daily_records",
        JSON.stringify(records)
    );

    localStorage.setItem(
        "wg_color",
        accent
    );

    localStorage.setItem(
        "wg_dark_mode",
        darkMode
    );

    localStorage.setItem(
        "wg_date",
        savedDate
    );
}


/* =========================
   DAILY RECORD
   ========================= */

function updateDailyRecord(amount) {

    const today = getToday();

    if (!records[today]) {
        records[today] = 0;
    }

    records[today] += amount;

    save();
}


/* =========================
   ADD COUNT
   ========================= */

function addCount(amount) {

    checkMidnightReset();

    if (amount <= 0) return;

    const oldCount = count;

    count += amount;

    savedTotal += amount;

    updateDailyRecord(amount);

    /*
       Every 108 beads complete one mala.
    */
    while (count >= MALA_SIZE) {

        count -= MALA_SIZE;

        completedMalas++;

        malaNumber++;
    }

    /*
       If count was exactly 108, the new mala starts at 0.
    */

    save();

    updateUI();
}


/* =========================
   MANUAL COUNT
   ========================= */

function manualAdd(amount) {
    addCount(amount);
}


/* =========================
   RESET CURRENT MALA
   ========================= */

function resetMala() {

    count = 0;

    save();

    updateUI();
}


/* =========================
   BUILD 108 BEADS
   ========================= */

function buildMala() {

    malaEl.innerHTML = "";

    const size =
        malaEl.parentElement.clientWidth;

    const center = size / 2;

    const radius = (size / 2) - 15;

    for (let i = 0; i < MALA_SIZE; i++) {

        const angle =
            (i / MALA_SIZE) *
            Math.PI * 2 -
            Math.PI / 2;

        const x =
            center +
            radius * Math.cos(angle);

        const y =
            center +
            radius * Math.sin(angle);

        const bead =
            document.createElement("div");

        bead.className = "bead";

        bead.style.left = x + "px";
        bead.style.top = y + "px";

        bead.dataset.index = i;

        malaEl.appendChild(bead);
    }

    updateBeads();
}


/* =========================
   UPDATE BEADS
   ========================= */

function updateBeads() {

    const beads =
        document.querySelectorAll(".bead");

    beads.forEach((bead, index) => {

        if (index < count) {

            bead.classList.add("active");

        } else {

            bead.classList.remove("active");
        }

    });
}


/* =========================
   UI
   ========================= */

function updateUI() {

    countEl.textContent = count;

    malaNumberEl.textContent =
        "Mala #" + malaNumber;

    completedMalasEl.textContent =
        completedMalas;

    savedTotalEl.textContent =
        savedTotal;

    currentMalaStatEl.textContent =
        count;

    const today = getToday();

    todayTotalEl.textContent =
        records[today] || 0;

    document.documentElement
        .style.setProperty(
            "--accent",
            accent
        );

    updateBeads();

    renderDailyRecords();
}


/* =========================
   DAILY RECORD DISPLAY
   ========================= */

function renderDailyRecords() {

    const dates =
        Object.keys(records).sort().reverse();

    if (dates.length === 0) {

        dailyRecordsEl.innerHTML =
            '<div class="empty">No daily records yet</div>';

        return;
    }

    dailyRecordsEl.innerHTML = "";

    dates.forEach(date => {

        const row =
            document.createElement("div");

        row.className = "day-row";

        row.innerHTML =
            `<span>${date}</span>
             <span class="day-count">
                ${records[date]}
             </span>`;

        dailyRecordsEl.appendChild(row);
    });
}


/* =========================
   COLOR MENU
   ========================= */

colorButton.addEventListener(
    "click",
    () => {

        colorMenu.classList.toggle(
            "show"
        );
    }
);


document.querySelectorAll(
    ".color-option"
).forEach(option => {

    option.addEventListener(
        "click",
        () => {

            accent =
                option.dataset.color;

            document
                .querySelectorAll(
                    ".color-option"
                )
                .forEach(x =>
                    x.classList.remove(
                        "selected"
                    )
                );

            option.classList.add(
                "selected"
            );

            save();

            updateUI();

            colorMenu.classList.remove(
                "show"
            );
        }
    );
});


/* =========================
   DARK MODE
   ========================= */

function applyDarkMode() {

    if (darkMode) {

        document.body.classList.remove(
            "light"
        );

        darkModeBtn.textContent = "🌙";

    } else {

        document.body.classList.add(
            "light"
        );

        darkModeBtn.textContent = "☀️";
    }
}


darkModeBtn.addEventListener(
    "click",
    () => {

        darkMode = !darkMode;

        save();

        applyDarkMode();
    }
);


/* =========================
   BEEP
   ========================= */

function beep() {

    try {

        const ctx =
            audioContext ||
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if (ctx.state === "suspended") {
            ctx.resume();
        }

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.frequency.value = 880;

        oscillator.type = "sine";

        gain.gain.setValueAtTime(
            0.001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.25,
            ctx.currentTime + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35
        );

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + 0.35
        );

    } catch (error) {

        console.log("Beep error:", error);
    }
}


/* =========================
   START MICROPHONE
   ========================= */

async function startListening() {

    if (listening) return;

    checkMidnightReset();

    if (
        !("SpeechRecognition" in window) &&
        !("webkitSpeechRecognition" in window)
    ) {

        alert(
            "Voice recognition is not supported by this browser. Try a supported browser such as Chrome."
        );

        return;
    }

    try {

        micStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        await audioContext.resume();

        const source =
            audioContext.createMediaStreamSource(
                micStream
            );

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 1024;

        source.connect(analyser);

        audioData =
            new Uint8Array(
                analyser.fftSize
            );

        listening = true;

        /*
           Important:
           timer starts from the moment
           listening begins.
        */
        lastActivityAt =
            performance.now();

        statusPill.textContent =
            "🎙️ Microphone Listening";

        statusPill.classList.add(
            "listening"
        );

        timerEl.textContent =
            "Listening — timer stopped";

        createRecognition();

        startRecognitionSafely();

        monitorAudio();

    } catch (error) {

        console.error(error);

        listening = false;

        statusPill.textContent =
            "Microphone Permission Needed";

        timerEl.textContent =
            "Microphone unavailable";
    }
}


/* =========================
   CREATE SPEECH RECOGNITION
   ========================= */

function createRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.lang = "en-IN";


    /* =====================
       RECOGNITION START
       ===================== */

    recognition.onstart = () => {

        recognitionRunning = true;

        recognitionStarting = false;

        if (listening) {

            statusPill.textContent =
                "🎙️ Microphone Listening";
        }
    };


    /* =====================
       SPEECH RESULTS
       ===================== */

    recognition.onresult = event => {

        if (!listening) return;

        let wordsFound = 0;

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            if (
                event.results[i].isFinal
            ) {

                const text =
                    event.results[i][0]
                        .transcript
                        .toLowerCase();

                /*
                   Recognize every occurrence
                   of the word Waheguru.
                */

                const matches =
                    text.match(
                        /\bwaheguru\b/gi
                    );

                if (matches) {

                    wordsFound +=
                        matches.length;
                }
            }
        }

        if (wordsFound > 0) {

            /*
               CRITICAL FIX:
               A recognized Waheguru always
               resets the 30-second silence timer.
            */

            lastActivityAt =
                performance.now();

            timerEl.textContent =
                "Waheguru heard — timer stopped";

            addCount(wordsFound);
        }
    };


    /* =====================
       RECOGNITION END
       ===================== */

    recognition.onend = () => {

        recognitionRunning = false;

        /*
           SpeechRecognition can end by itself.
           That does NOT mean the user stopped
           listening.

           Restart it while our own listening
           state is still true.
        */

        if (listening) {

            scheduleRecognitionRestart();
        }
    };


    /* =====================
       RECOGNITION ERROR
       ===================== */

    recognition.onerror = event => {

        console.log(
            "Speech recognition:",
            event.error
        );

        /*
           Temporary errors should not
           turn the microphone off.
        */

        if (
            listening &&
            event.error !== "not-allowed" &&
            event.error !== "service-not-allowed"
        ) {

            scheduleRecognitionRestart();

        } else if (event.error === "not-allowed") {

            stopListening(false);
        }
    };
}


/* =========================
   SAFE RECOGNITION START
   ========================= */

function startRecognitionSafely() {

    if (
        !listening ||
        recognitionRunning ||
        recognitionStarting
    ) {
        return;
    }

    recognitionStarting = true;

    try {

        recognition.start();

    } catch (error) {

        recognitionStarting = false;

        scheduleRecognitionRestart();
    }
}


/* =========================
   RESTART RECOGNITION
   ========================= */

function scheduleRecognitionRestart() {

    clearTimeout(
        recognitionRestartTimer
    );

    recognitionRestartTimer =
        setTimeout(() => {

            if (!listening) return;

            startRecognitionSafely();

        }, 500);
}


/* =========================
   AUDIO MONITOR
   ========================= */

function monitorAudio() {

    if (!listening || !analyser) return;

    analyser.getByteTimeDomainData(
        audioData
    );

    let sum = 0;

    for (let i = 0; i < audioData.length; i++) {

        const value =
            (audioData[i] - 128) / 128;

        sum += value * value;
    }

    const rms =
        Math.sqrt(
            sum / audioData.length
        );

    const now =
        performance.now();

    /*
       AUDIO ACTIVITY

       If the microphone hears enough
       sound, the 30-second silence
       countdown is reset.

       This means:

       Waheguru
       pause
       Waheguru
       pause
       Waheguru

       keeps the timer from stopping
       as long as each pause is under
       30 seconds.
    */

    if (rms >= AUDIO_THRESHOLD) {

        lastActivityAt = now;

        timerEl.textContent =
            "Voice detected — timer stopped";

    } else {

        const silence =
            now - lastActivityAt;

        const remaining =
            Math.max(
                0,
                SILENCE_TIME - silence
            );

        const seconds =
            Math.ceil(
                remaining / 1000
            );

        if (remaining <= 0) {

            autoPause();

            return;
        }

        timerEl.textContent =
            "No voice — mic-off in " +
            seconds +
            "s";
    }

    audioMonitor =
        requestAnimationFrame(
            monitorAudio
        );
}


/* =========================
   AUTO PAUSE
   ========================= */

function autoPause() {

    if (!listening) return;

    /*
       Beep when the microphone
       automatically stops.
    */

    beep();

    stopListening(false);

    timerEl.textContent =
        "🔔 Microphone stopped — 30 seconds silence";
}


/* =========================
   STOP LISTENING
   ========================= */

function stopListening(showPausedText = true) {

    listening = false;

    clearTimeout(
        recognitionRestartTimer
    );

    cancelAnimationFrame(
        audioMonitor
    );

    recognitionStarting = false;

    if (recognition) {

        try {
            recognition.stop();
        } catch (error) {}
    }

    recognitionRunning = false;

    if (micStream) {

        micStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        micStream = null;
    }

    if (audioContext) {

        try {
            audioContext.close();
        } catch (error) {}

        audioContext = null;
    }

    analyser = null;

    statusPill.textContent =
        "Microphone Off";

    statusPill.classList.remove(
        "listening"
    );

    if (showPausedText) {

        timerEl.textContent =
            "Paused";
    }
}


/* =========================
   BUTTONS
   ========================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startListening
);


document.getElementById(
    "pauseBtn"
).addEventListener(
    "click",
    () => {

        stopListening(true);
    }
);


document.getElementById(
    "resetBtn"
).addEventListener(
    "click",
    resetMala
);


/* =========================
   MIDNIGHT CHECK
   ========================= */

setInterval(() => {

    const before = savedDate;

    checkMidnightReset();

    if (before !== savedDate) {

        updateUI();
    }

}, 1000);


/* =========================
   INITIALIZE
   ========================= */

checkMidnightReset();

applyDarkMode();

updateUI();

buildMala();

window.addEventListener(
    "resize",
    buildMala
);


/* Restore selected color */

document
    .querySelectorAll(".color-option")
    .forEach(option => {

        if (
            option.dataset.color ===
            accent
        ) {

            option.classList.add(
                "selected"
            );
        } else {

            option.classList.remove(
                "selected"
            );
        }
    });

</script>
